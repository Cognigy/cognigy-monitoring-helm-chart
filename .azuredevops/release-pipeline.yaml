name: $(why)_helm_release_$(SourceBranchName)_$(Date:yyyyMMdd)

trigger:
  batch: true
  branches:
    exclude:
      - "*"
  tags:
    include:
      - "*"

resources:
  repositories:
    - repository: self

variables:
  azureContainerRegistry: "Azure Container Registry Prod"
  chartPath: "cognigy-monitoring"
  chartGithubPath: "cognigy-monitoring-helm-chart"
  AzureDevOpsRepo: "cognigy-monitoring-stack"
  chartName: "cognigy-monitoring"
  ACRName: "cognigy.azurecr.io"
  ACRPath: "helm"
  ${{ if eq(variables['Build.Reason'], 'Manual') }}:
    why: Manual
  ${{ else }}:
    why: CD

pool:
  vmImage: ubuntu-24.04


stages:
  - stage: helmChartRelease
    displayName: Create a new release tag and Helm Chart release
    condition: startsWith(variables['Build.SourceBranch'], 'refs/tags/')
    jobs:
      - job: createOciRelease
        displayName: Publish Helm Chart OCI Fragment
        steps:
          - task: HelmInstaller@0
            displayName: Install Helm 3.8.2
            inputs:
              helmVersion: 3.8.2
              checkLatestHelmVersion: false

          - task: Docker@2
            displayName: Login into container registry
            inputs:
              command: 'login'
              containerRegistry: $(azureContainerRegistry)

          - bash: |
              helm version
              helmChartVersion="$(yq e '.version' $(chartPath)/Chart.yaml)"
              echo "Helm Chart" $(chartName) "version:" $helmChartVersion
              helm package --dependency-update $(chartPath)
              helm push ./$(chartName)-$helmChartVersion.tgz oci://$(ACRName)/$(ACRPath)


      - job: createGithubRelease
        displayName: Publish Helm Chart Github repo
        variables:
          - group: github-app-creds
        steps:
          - task: HelmInstaller@0
            displayName: Install Helm 3.8.2
            inputs:
              helmVersion: 3.8.2
              checkLatestHelmVersion: false

          - checkout: self
            clean: "true"
            displayName: Checkout Helm Chart Source Repo

          - task: DownloadSecureFile@1
            name: githubAppKey
            displayName: Download GitHub App private key
            inputs:
              secureFile: cognigy-bypass-branch-protection.2026-07-08.private-key.pem

          - script: |
              set -euo pipefail

              app_id="$(GH_APP_ID)"
              installation_id="$(GH_APP_INSTALLATION_ID)"
              pem="$(githubAppKey.secureFilePath)"

              # Build a short-lived JWT (RS256) signed with the GitHub App private key
              now=$(date +%s)
              iat=$((now - 60))
              exp=$((now + 540))

              b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
              header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
              payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$iat" "$exp" "$app_id" | b64url)
              unsigned="${header}.${payload}"
              signature=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$pem" -binary | b64url)
              jwt="${unsigned}.${signature}"

              # Exchange the JWT for a GitHub App installation access token
              token=$(curl -sS -X POST \
                -H "Authorization: Bearer ${jwt}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/app/installations/${installation_id}/access_tokens" \
                | yq e '.token' -)

              if [ -z "$token" ] || [ "$token" = "null" ]; then
                echo "Failed to obtain GitHub App installation token"
                exit 1
              fi

              echo "##vso[task.setsecret]$token"
              echo "##vso[task.setvariable variable=GH_TOKEN;issecret=true]$token"
            displayName: Generate GitHub App installation token

          - script: |
              set -euo pipefail

              git config --global user.email "azure-pipeline@cognigy.com"
              git config --global user.name "Azure Pipelines Bot"

              githubDir="$(Agent.BuildDirectory)/$(chartGithubPath)"
              rm -rf "$githubDir"
              git clone "https://x-access-token:$(GH_TOKEN)@github.com/Cognigy/cognigy-monitoring-helm-chart.git" "$githubDir"

              # Wipe existing chart contents (the repo's .git directory is preserved)
              cd "$githubDir"
              rm -fr ./*
              cd "$(Build.SourcesDirectory)"

              helmChartVersion="$(yq e '.version' $(chartPath)/Chart.yaml)"
              echo "Helm Chart version is $helmChartVersion"

              rm -fr .git
              rm -fr CHANGELOG
              cp -r ./ "$githubDir"

              cd "$githubDir"
              git add -A
              git commit -m "Adding files for Helm Chart $helmChartVersion"
              git tag v$helmChartVersion

              git push origin main
              git push origin tags/v$helmChartVersion