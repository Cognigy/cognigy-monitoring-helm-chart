# Target namespace for alerts
appNamespacesTarget: ".*"

# Default Prometheus Runbook URL
runbookUrl: "https://runbooks.prometheus-operator.dev/runbooks"

# Enable/disable alert rules groups and separate alerts
rules:
  # Generic kubernetes alert rules for Cognigy products
  kubernetes:
    enabled: true
    kubePodCrashLooping:
      enabled: true
      severity: critical
    kubeDeploymentReplicasMismatch:
      enabled: true
      severity: warning
      timeout: 15m
    kubeStatefulSetReplicasMismatch:
      enabled: true
      severity: warning
      timeout: 15m
    kubePodNotReady:
      enabled: true
      severity: warning
      timeout: 30m
    podManyRestarts:
      enabled: true
      severity: warning
      containerBlacklist: "^falco.*"
      timeout: 5m
      restartsPerHour: 3
      restartsTotal: 20
    containerOOMKilled:
      enabled: true
      severity: warning
      containerSingleOOMBlacklist: "^cube-.*|^service-.*|^falco.*"
      containerMultiOOMWhitelist: "^cube-.*|^service-.*"
      timeout: 5m
      # Threshold for ContainerMultiOOMKilled alert
      threshold: 3
      offset: 3h
    cpuThrottlingBackendServiceHigh:
      enabled: true
      severity: warning
      # Backend services Pods monitored for CPU throttling
      monitoredPods: "mongodb.*|redis.*|rabbitmq.*|traefik.*|nginx.*|.*postgres.*|mysql.*|qdrant.*"
      timeout: 15m
    hpaMaxReplicasReached:
      enabled: true
      severity: warning
      timeout: 15m

  # Traefik alert rules
  traefik:
    enabled: true
    traefikHighHttp5xxErrorRateService:
      enabled: true
      # Threshold of 5xx error rate % for traefikHighHttp5xxErrorRateService to start firing
      threshold: 5
    traefikHighHttp4xxErrorRateService:
      enabled: false
    traefikOpenConnectionsHigh:
      enabled: true
    traefikTlsCertExpireSoon:
      enabled: true

  # NGiNX Ingress alert rules (disabled by default)
  nginx:
    enabled: false
    nginxHighHttp5xxErrorRate:
      enabled: true
    nginxHighHttp4xxErrorRate:
      enabled: false
    nginxLatencyHigh:
      enabled: true
    nginxTlsCertExpireSoon:
      enabled: true

  # RabbitMQ alert rules
  rabbitmq:
    enabled: true
    rabbitmqMemoryHigh:
      enabled: true
    rabbitmqHighWatermarkCrossed:
      enabled: true
    rabbitmqReadyMessageGettingHigh:
      enabled: false
      threshold: 20
    rabbitmqReadyQueueHigh:
      enabled: false
      warnThreshold: 100
      criticalThreshold: 500
    rabbitmqUnackedMessageGettingHigh:
      enabled: false
      threshold: 20
    rabbitmqUnackedQueueHigh:
      enabled: false
      warnThreshold: 300
      criticalThreshold: 700

  # RabbitMQ detailed alert rules
  rabbitmqDetailed:
    enabled: true
    rabbitmqReadyMessageGettingHigh:
      enabled: true
      threshold: 20
      excludeQueues:
        - "^amq\\.gen-.*"
        - "^rpc-callback-.*"
        - "^service-testing-execution-simulation-v[0-9]+-run-queue$"
    rabbitmqReadyQueueHigh:
      enabled: true
      warnThreshold: 100
      criticalThreshold: 500
      excludeQueues:
        - "^amq\\.gen-.*"
        - "^rpc-callback-.*"
        - "^service-testing-execution-simulation-v[0-9]+-run-queue$"
    rabbitmqUnackedMessageGettingHigh:
      enabled: true
      threshold: 20
      excludeQueues:
        - "^amq\\.gen-.*"
        - "^rpc-callback-.*"
        - "^service-testing-execution-simulation-v[0-9]+-run-queue$"
    rabbitmqUnackedQueueHigh:
      enabled: true
      warnThreshold: 300
      criticalThreshold: 700
      excludeQueues:
        - "^amq\\.gen-.*"
        - "^rpc-callback-.*"
        - "^service-testing-execution-simulation-v[0-9]+-run-queue$"

  # Redis alert rules
  redis:
    enabled: true
    redisBlockedClients:
      enabled: true
      threshold: 50

  # PostgreSQL alert rules
  postgresql:
    enabled: false
    tooManyConnections:
      enabled: true
      threshold: 85
    highRollbackRate:
      enabled: true
      threshold: 5
    deadLocks:
      enabled: true
      threshold: 1
    tooManyLocks:
      enabled: true
      threshold: 0.2
      ignoredLockTypes:
        - "AccessShareLock"
    pgReplicationLag:
      enabled: true
      warnThreshold: 15
      criticalThreshold: 60
    unusedReplicationSlot:
      enabled: true
    patroni:
      enabled: true
      replicationLag:
        enabled: true
        threshold: 500

  # MongoDB alert rules
  mongodb:
    enabled: true
    mongodbDown:
      enabled: true
    mongodbReplicaMemberUnhealthy:
      enabled: true
    mongodbReplicationLag:
      enabled: true
      # Threshold of mongodb replica lagging behind (in seconds)
      threshold: 900
    mongodbNumberCursorsOpen:
      enabled: true
    mongodbCursorsTimeouts:
      enabled: true
    mongodbTooManyConnections:
      enabled: true
    mongodbVirtualMemoryUsage:
      enabled: false

  # Velero alert rules
  velero:
    enabled: false

  # FluxCD alert rules
  fluxcd:
    enabled: false
    fluxKustomizationFailure:
      enabled: true
      period: 15m
    fluxHelmReleaseFailure:
      enabled: true
      period: 15m
    fluxHelmReleaseFailureLongDuration:
      enabled: true
      period: 2h
      targetHelmRelease: 
      - "cognigy-.*"
      - "live-agent"
      - "voicegateway"
    fluxSourceIssue:
      enabled: true
      period: 15m
    fluxImageIssue:
      enabled: false
      period: 15m
    fluxResourceInSuspendedState:
      enabled: true
      period: 2h
      resourceKinds: []
        # - "Alert"
        # - "Kustomization"
        # - "HelmRelease"
        # - "GitRepository"
        # - "HelmRepository"
        # - "Bucket"
        # - "OCIRepository"
        # - "ImagePolicy"
        # - "ImageRepository"
        # - "ImageUpdateAutomation"


  # Cognigy.AI alert rules
  ai:
    enabled: true
    cpuThrottlingAIServiceHigh:
      enabled: true
      severity: warning
      timeout: 15m
    conversationVolume:
      enabled: true
      threshold: 1000
    conversationVolumeDynamic:
      enabled: true
      percentageThreshold: 30
      baselineDays: 7
    nlpMatcher:
      enabled: true
    functionExecution:
      enabled: true
    serviceExecution:
      enabled: true
    serviceHttp:
      enabled: true
      # Quantile of http requests for high latency evaluation
      requestLatencyHighQuantile: 0.8
      # Threshold (seconds) for high latency of http requests
      requestLatencyHighThreshold: 15
    serviceHandover:
      enabled: true
      errorsHigh:
        enabled: true
        # Threshold on number of service handover errors per 5 min
        threshold: 2
      requestLatencyHigh:
        enabled: true
        quantile: 0.95
        # Threshold (seconds) for high requests latency to external providers
        threshold: 2
      request5xxErrorRate:
        enabled: true
        # Threshold for 5xx errors to external providers per minute
        threshold: 2
      rPCCallFailureRateHigh:
        enabled: true
        # Threshold for request_handover_rpc_calls_error
        evaluationWindow: 5m
        threshold: 30
        numberOfErrors: 20
      sendMessageToProviderErrorRateHigh:
        enabled: true
        evaluationWindow: 5m
        threshold: 50
        # criticalThreshold: 75
      eventRPCErrorRateHigh:
        enabled: true
        evaluationWindow: 5m
        threshold: 10
        numberOfErrors: 20
      containerRestartWarning:
        enabled: true
        evaluationWindow: 5m
        threshold: 0

    serviceEndpoint:
      enabled: true
      # Message processing Time quantile to analyze
      messageProcessingTimeQuantile: 0.8
      # Threshold (sec) of Message processing Time for EndpointMessageProcessingTimeHigh to start firing
      messageProcessingTimeThreshold: 50
      # Threshold of increase (%) of Message Processing Time for EndpointMessageProcessingTimeIncreasing to start firing
      messageProcessingTimeIncreasingThreshold: 300
      # Baseline for Message processing Time (sec) to avoid false positives of EndpointMessageProcessingTimeIncreasing alert,
      # increases above messageProcessingTimeIncreasingThreshold and with the baseline below messageProcessingTimeBaseline are ignored
      messageProcessingTimeBaseline: 10
      serviceEndpointOOMKilled:
        enabled: true
        severity: warning
        timeout: 5m
        threshold: 0
        offset: 3h
    serviceCollaboration:
      enabled: true
      unhandledErrorThreshold: 5
      # Temporarily making this very high until we have made the queries efficient
      requestLatencyHighThreshold: 5000

  # Cognigy.AI runtime services alert rules
  runtime:
    enabled: true
    serviceAI:
      enabled: true

    serviceAppSessionManager:
      enabled: true
    serviceExecution:
      enabled: true
    serviceFunctionExecution:
      enabled: true
    serviceHttp:
      enabled: true
    serviceNlpMatcher:
      enabled: true
    servicePlaybookExecution:
      enabled: true
    serviceSessionStateManager:
      enabled: true

  # Cognigy Voice Gateway alert rules
  vg:
    enabled: false
    featureServer:
      enabled: true
      uncaughtErrors:
        enabled: true
        threshold: 5
      taskErrors:
        enabled: true
        threshold: 25
      handoverErrors:
        enabled: true
        threshold: 5
      analyticsDataErrors:
        enabled: true
        threshold: 5
    cpuThrottlingVGServiceHigh:
      enabled: true
      severity: warning
      timeout: 1m
    kubeVgPodNotReady:
      enabled: true
      severity: critical
      timeout: 5m

  # Cognigy Live Agent alert rules
  la:
    enabled: false
    HighHttpErrorRate:
      enabled: true
      threshold: 5
    EndpointSlowRequest:
      enabled: true
      threshold: 10

  insights:
    enabled: true
    analyticsCollector:
      enabled: true
      processedVsStored:
        threshold: 100
