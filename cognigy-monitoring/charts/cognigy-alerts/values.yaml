# Target namespace for alerts
appNamespacesTarget: ".*"

# Default Prometheus Runbook URL
runbookUrl: "https://runbooks.prometheus-operator.dev/runbooks"

# Enable/disable alert rules groups and separate alerts
rules:
  # Generic kubernetes alert rules for Cognigy products
  kubernetes:
    enabled: true
    kubePodCrashLooping:
      enabled: true
      severity: critical
    kubeDeploymentReplicasMismatch:
      enabled: true
      severity: warning
      timeout: 15m
    kubeStatefulSetReplicasMismatch:
      enabled: true
      severity: warning
      timeout: 15m
    kubePodNotReady:
      enabled: true
      severity: warning
      timeout: 30m
    podManyRestarts:
      enabled: true
      severity: warning
      containerBlacklist: "^falco.*"
      timeout: 5m
      restartsPerHour: 3
      restartsTotal: 20
    containerOOMKilled:
      enabled: true
      severity: warning
      containerSingleOOMBlacklist: "^cube-.*|^service-.*|^falco.*"
      containerMultiOOMWhitelist: "^cube-.*|^service-.*"
      timeout: 5m
      # Threshold for ContainerMultiOOMKilled alert
      threshold: 3
      offset: 3h
    cpuThrottlingBackendServiceHigh:
      enabled: true
      severity: warning
      # Backend services Pods monitored for CPU throttling
      monitoredPods: "mongodb.*|redis.*|rabbitmq.*|traefik.*|nginx.*|.*postgres.*|mysql.*|qdrant.*"
      timeout: 15m
    hpaMaxReplicasReached:
      enabled: true
      severity: warning
      timeout: 15m

  # Traefik alert rules
  traefik:
    enabled: true
    traefikHighHttp5xxErrorRateService:
      enabled: true
      # Threshold of 5xx error rate % for traefikHighHttp5xxErrorRateService to start firing
      threshold: 5
    traefikHighHttp4xxErrorRateService:
      enabled: false
    traefikOpenConnectionsHigh:
      enabled: true
    traefikTlsCertExpireSoon:
      enabled: true

  # NGiNX Ingress alert rules (disabled by default)
  nginx:
    enabled: false
    nginxHighHttp5xxErrorRate:
      enabled: true
    nginxHighHttp4xxErrorRate:
      enabled: false
    nginxLatencyHigh:
      enabled: true
    nginxTlsCertExpireSoon:
      enabled: true

  # RabbitMQ alert rules
  rabbitmq:
    enabled: true
    rabbitmqMemoryHigh:
      enabled: true
    rabbitmqHighWatermarkCrossed:
      enabled: true
    rabbitmqReadyMessageGettingHigh:
      enabled: false
      threshold: 20
    rabbitmqReadyQueueHigh:
      enabled: false
      warnThreshold: 100
      criticalThreshold: 500
    rabbitmqUnackedMessageGettingHigh:
      enabled: false
      threshold: 20
    rabbitmqUnackedQueueHigh:
      enabled: false
      warnThreshold: 300
      criticalThreshold: 700

  # RabbitMQ detailed alert rules
  rabbitmqDetailed:
    enabled: true
    rabbitmqReadyMessageGettingHigh:
      enabled: true
      threshold: 20
      excludeQueues:
        - "^amq\\.gen-.*"
        - "^rpc-callback-.*"
        - "^service-testing-execution-simulation-v[0-9]+-run-queue$"
    rabbitmqReadyQueueHigh:
      enabled: true
      warnThreshold: 100
      criticalThreshold: 500
      excludeQueues:
        - "^amq\\.gen-.*"
        - "^rpc-callback-.*"
        - "^service-testing-execution-simulation-v[0-9]+-run-queue$"
    rabbitmqUnackedMessageGettingHigh:
      enabled: true
      threshold: 20
      excludeQueues:
        - "^amq\\.gen-.*"
        - "^rpc-callback-.*"
        - "^service-testing-execution-simulation-v[0-9]+-run-queue$"
    rabbitmqUnackedQueueHigh:
      enabled: true
      warnThreshold: 300
      criticalThreshold: 700
      excludeQueues:
        - "^amq\\.gen-.*"
        - "^rpc-callback-.*"
        - "^service-testing-execution-simulation-v[0-9]+-run-queue$"

  # Redis alert rules
  redis:
    enabled: true
    redisBlockedClients:
      enabled: true
      threshold: 50

  # PostgreSQL alert rules
  postgresql:
    enabled: false
    tooManyConnections:
      enabled: true
      threshold: 85
    highRollbackRate:
      enabled: true
      threshold: 5
    deadLocks:
      enabled: true
      threshold: 1
    tooManyLocks:
      enabled: true
      threshold: 0.2
      ignoredLockTypes:
        - "AccessShareLock"
    pgReplicationLag:
      enabled: true
      warnThreshold: 15
      criticalThreshold: 60
    unusedReplicationSlot:
      enabled: true
    patroni:
      enabled: true
      replicationLag:
        enabled: true
        threshold: 500

  # MongoDB alert rules
  mongodb:
    enabled: true
    mongodbDown:
      enabled: true
    mongodbReplicaMemberUnhealthy:
      enabled: true
    mongodbReplicationLag:
      enabled: true
      # Threshold of mongodb replica lagging behind (in seconds)
      threshold: 900
    mongodbNumberCursorsOpen:
      enabled: true
    mongodbCursorsTimeouts:
      enabled: true
    mongodbTooManyConnections:
      enabled: true
    mongodbVirtualMemoryUsage:
      enabled: false

  # Velero alert rules
  velero:
    enabled: false
    # increase() lookback window; keep it above the 12h repeat_interval and the backup cadence.
    lookbackWindow: "25h"
    # PromQL label selectors to exclude from the alerts, appended as `unless`
    # clauses. Scope is cluster+schedule only (no app-namespace/volume label).
    #   - '{namespace="velero", schedule="velero-full"}'
    failureExcludeSelectors: []
    partialFailureExcludeSelectors: []

  # FluxCD alert rules
  fluxcd:
    enabled: false
    fluxKustomizationFailure:
      enabled: true
      period: 15m
    fluxHelmReleaseFailure:
      enabled: true
      period: 15m
    fluxHelmReleaseFailureLongDuration:
      enabled: true
      period: 2h
      targetHelmRelease: 
      - "cognigy-.*"
      - "live-agent"
      - "voicegateway"
    fluxSourceIssue:
      enabled: true
      period: 15m
    fluxImageIssue:
      enabled: false
      period: 15m
    fluxResourceInSuspendedState:
      enabled: true
      period: 2h
      resourceKinds: []
        # - "Alert"
        # - "Kustomization"
        # - "HelmRelease"
        # - "GitRepository"
        # - "HelmRepository"
        # - "Bucket"
        # - "OCIRepository"
        # - "ImagePolicy"
        # - "ImageRepository"
        # - "ImageUpdateAutomation"

  # Sealed Secrets alert rules
  sealedSecrets:
    enabled: false
    sealedSecretNotSynced:
      enabled: true
      period: 15m
      severity: warning
    sealedSecretUnsealError:
      enabled: true
      period: 5m
      severity: warning
    sealedSecretControllerDown:
      enabled: true
      period: 5m
      severity: warning

  # Azure Load Balancer alert rules (Promitor-scraped azure_lb_* metrics).
  azureLoadBalancer:
    enabled: false
    # Promitor scraper is not exporting azure_lb_* metrics at all.
    azureLBMetricsAbsent:
      enabled: true
      severity: warning
      timeout: 15m
    # LB frontend (VIP) availability dropped below threshold % over 5m.
    azureLBVipUnavailable:
      enabled: true
      severity: warning
      timeout: 5m
      threshold: 90
    # LB backend (DIP) health probes failing — threshold is per-LB averaged availability %.
    azureLBDipUnavailable:
      enabled: true
      severity: warning
      timeout: 5m
      threshold: 80
    # Predictive: a node is using > threshold fraction of its allocated TCP SNAT ports.
    azureLBSnatPortsHighUsage:
      enabled: true
      severity: warning
      timeout: 10m
      # Fraction (0.0 – 1.0); 0.8 = 80% of allocated TCP SNAT ports.
      threshold: 0.8
    azureLBSnatExhaustionWarning:
      enabled: true
      severity: warning
      timeout: 5m
      threshold: 10
    azureLBSnatExhaustionHigh:
      enabled: true
      severity: critical
      timeout: 5m
      threshold: 50


  # Cognigy.AI alert rules
  ai:
    enabled: true
    cpuThrottlingAIServiceHigh:
      enabled: true
      severity: warning
      timeout: 15m
    conversationVolume:
      enabled: true
      threshold: 1000
    conversationVolumeDynamic:
      enabled: true
      # Alert when smoothed volume exceeds the dynamic baseline by this percentage.
      percentageThreshold: 30
      # Lookback window used to build the baseline.
      baselineDays: 7
      # Smoothing window for both the current value and the baseline samples.
      # A longer window (e.g. 30m) averages out short spikes and avoids the
      # quantization noise of 1-minute message counts.
      smoothingWindow: 30m
      # Quantile used for the baseline. A high quantile (0.99) reflects the
      # cluster's real active peak instead of being pulled down by idle periods,
      # which is what caused frequent false positives on small/dev clusters.
      baselineQuantile: 0.99
      # Absolute floor (messages per smoothingWindow). Below this the alert never
      # fires, so low-traffic clusters don't page on a 30% jump that is only a
      # handful of extra messages.
      minMessages: 500
      # 'for' duration the condition must hold before firing.
      timeout: 15m
    nlpMatcher:
      enabled: true
    functionExecution:
      enabled: true
    serviceExecution:
      enabled: true
    serviceHttp:
      enabled: true
      # Quantile of http requests for high latency evaluation
      requestLatencyHighQuantile: 0.8
      # Threshold (seconds) for high latency of http requests
      requestLatencyHighThreshold: 15
    serviceHandover:
      enabled: true
      errorsHigh:
        enabled: true
        # Threshold on number of service handover errors per 5 min
        threshold: 2
      requestLatencyHigh:
        enabled: true
        quantile: 0.95
        # Threshold (seconds) for high requests latency to external providers
        threshold: 2
      request5xxErrorRate:
        enabled: true
        # Threshold for 5xx errors to external providers per minute
        threshold: 2
      rPCCallFailureRateHigh:
        enabled: true
        # Threshold for request_handover_rpc_calls_error
        evaluationWindow: 5m
        threshold: 30
        numberOfErrors: 20
      sendMessageToProviderErrorRateHigh:
        enabled: true
        evaluationWindow: 5m
        threshold: 50
        # criticalThreshold: 75
      eventRPCErrorRateHigh:
        enabled: true
        evaluationWindow: 5m
        threshold: 10
        numberOfErrors: 20
      containerRestartWarning:
        enabled: true
        evaluationWindow: 5m
        threshold: 0

    serviceEndpoint:
      enabled: true
      # Message processing Time quantile to analyze
      messageProcessingTimeQuantile: 0.8
      # Threshold (sec) of Message processing Time for EndpointMessageProcessingTimeHigh to start firing
      messageProcessingTimeThreshold: 50
      # Threshold of increase (%) of Message Processing Time for EndpointMessageProcessingTimeIncreasing to start firing
      messageProcessingTimeIncreasingThreshold: 300
      # Baseline for Message processing Time (sec) to avoid false positives of EndpointMessageProcessingTimeIncreasing alert,
      # increases above messageProcessingTimeIncreasingThreshold and with the baseline below messageProcessingTimeBaseline are ignored
      messageProcessingTimeBaseline: 10
      serviceEndpointOOMKilled:
        enabled: true
        severity: warning
        timeout: 5m
        threshold: 0
        offset: 3h
    serviceCollaboration:
      enabled: true
      unhandledErrorThreshold: 5
      # Temporarily making this very high until we have made the queries efficient
      requestLatencyHighThreshold: 5000
    # service-cxone-aws-gateway alert rules
    cxoneAwsGateway:
      enabled: false
      kinesisConsumptionFailure:
        enabled: false
      kinesisSubscriptionRateExceeded:
        enabled: false
        # Regex matching Kinesis subscription-related operations
        operationRegex: "SubscribeToShard"
        # Subscription error rate per minute that triggers the alert
        threshold: 5
      crossAccountRoleFailure:
        enabled: false
        # STS AssumeRole error rate per minute that triggers the alert
        threshold: 5

  # LLM Gateway V1 API alert rules
  llmGateway:
    enabled: false
    errorRateHigh:
      enabled: true
      # Fraction of failed requests that triggers a warning (0.05 = 5%)
      warningThreshold: 0.05
      # Fraction of failed requests that triggers a critical alert (0.10 = 10%)
      criticalThreshold: 0.10
    requestLatencyHigh:
      enabled: true
      # Quantile to evaluate for high latency
      quantile: 0.95
      # Warning threshold in seconds
      warningThreshold: 5
      # Critical threshold in seconds
      criticalThreshold: 10
    rateLimitErrors:
      enabled: true
      # Fraction of config-set failures that are rate-limit errors before warning (0.20 = 20%)
      warningThreshold: 0.20
      # Fraction of config-set failures that are rate-limit errors before critical alert (0.40 = 40%)
      criticalThreshold: 0.40
    elevatedFallbackRate:
      enabled: true
      # Fraction of requests that activate a config-set fallback (0.10 = 10%)
      threshold: 0.10
    timeToFirstToken:
      enabled: true
      # p95 time-to-first-token warning threshold in seconds
      warningThreshold: 5
      # p95 time-to-first-token critical threshold in seconds
      criticalThreshold: 10

  # Serverless router alert rules
  serverless:
    enabled: false
    executionSlo:
      enabled: true
      # p95 stream duration warning threshold in seconds
      warningThreshold: 10
      # p95 stream duration critical (SLO) threshold in seconds
      criticalThreshold: 15
    coldStartSlo:
      enabled: true
      # p95 cold start routing duration warning threshold in seconds
      warningThreshold: 10
      # p95 cold start routing duration critical (SLO) threshold in seconds
      criticalThreshold: 15
    coldStartRolloutTimeouts:
      enabled: true
      # Number of rollout timeouts in 10m to trigger critical alert
      threshold: 20
    routingErrors:
      enabled: true
      # Routing errors per second warning threshold (20 in 5m = 0.0667)
      warningThreshold: 0.0667
      # Routing errors per second critical threshold (100 in 10m = 0.1667)
      criticalThreshold: 0.1667
    reconcileErrors:
      enabled: true
      # Reconcile errors per second warning threshold (20 in 5m = 0.0667)
      warningThreshold: 0.0667
      # Reconcile errors per second critical threshold (100 in 10m = 0.1667)
      criticalThreshold: 0.1667
    builderFailures:
      enabled: true
      # Number of builder failures in 10m to trigger critical alert
      threshold: 20
    lockAcquisitionTimeouts:
      enabled: true
      # Lock acquisition timeouts per second threshold (20 in 5m = 0.0667)
      threshold: 0.0667
    lockContention:
      enabled: true
      # Lock contention per second threshold (20 in 5m = 0.0667)
      threshold: 0.0667
    lifecyclePendingWrites:
      enabled: true
      # Pending writes gauge threshold
      threshold: 100

  # Cognigy.AI runtime services alert rules
  runtime:
    enabled: true
    serviceAI:
      enabled: true

    serviceAppSessionManager:
      enabled: true
    serviceExecution:
      enabled: true
    serviceFunctionExecution:
      enabled: true
    serviceHttp:
      enabled: true
    serviceNlpMatcher:
      enabled: true
    servicePlaybookExecution:
      enabled: true
    serviceSessionStateManager:
      enabled: true

  # Cognigy Voice Gateway alert rules
  vg:
    enabled: false
    featureServer:
      enabled: true
      uncaughtErrors:
        enabled: true
        threshold: 5
      taskErrors:
        enabled: true
        threshold: 25
      handoverErrors:
        enabled: true
        threshold: 5
      unhandledRejections:
        enabled: true
        threshold: 5
      wsMaxReconnectsExceeded:
        enabled: true
      wsConnectionTimeouts:
        enabled: true
      speechErrors:
        enabled: true
        threshold: 10
      grpcTtsErrors:
        enabled: true
        threshold: 5
      speechFallback:
        enabled: true
        threshold: 5
      callSetupTimeSlow:
        enabled: true
        threshold: 5000
      webhookConnectionErrors:
        enabled: true
        threshold: 5
      audioPlayerThreadLeak:
        enabled: true
        timeout: 10m
      eslEventLoopFreeze:
        enabled: true
        timeout: 10m
      analyticsDataErrors:
        enabled: true
        threshold: 5
      # Media frame-rate stall alerts on the p10 of vg_freeswitch_{stt,tts}_frames_per_second
      # (target 50 fps). warningThreshold is the p10 fps below which the alert fires;
      # criticalThreshold is available for a second tier. Each alert is traffic-gated to
      # minTrafficFraction of the cluster's recent peak so idle windows produce no series.
      sttFrameRateLow:
        enabled: true
        warningThreshold: 40
        criticalThreshold: 25
        minTrafficFraction: 0.1
        timeout: 5m
      ttsFrameRateLow:
        enabled: true
        warningThreshold: 40
        criticalThreshold: 25
        minTrafficFraction: 0.1
        timeout: 5m
      # Inbound RTP audio-quality alerts on the mod_prometheus per-call histograms. minCalls
      # gates each alert on call volume so a sparse window cannot trip a quantile. Set enabled
      # true where thresholds have been aligned to the environment's baseline.
      audioQuality:
        lowMos:
          enabled: false
          threshold: 3.5
          minCalls: 20
          timeout: 10m
        badCallShare:
          enabled: false
          threshold: 0.10
          minCalls: 20
          timeout: 15m
        highLoss:
          enabled: false
          threshold: 0.05
          minCalls: 20
          timeout: 15m
        highJitter:
          enabled: false
          threshold: 50
          minCalls: 20
          timeout: 15m
    cpuThrottlingVGServiceHigh:
      enabled: true
      severity: warning
      timeout: 1m
    kubeVgPodNotReady:
      enabled: true
      severity: critical
      timeout: 5m

  # Cognigy Live Agent alert rules
  la:
    enabled: false
    HighHttpErrorRate:
      enabled: true
      threshold: 5
    EndpointSlowRequest:
      enabled: true
      threshold: 10

  insights:
    enabled: true
    analyticsCollector:
      enabled: true
      processedVsStored:
        threshold: 100
