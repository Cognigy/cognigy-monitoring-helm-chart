{{- $targetNamespace := .Values.appNamespacesTarget }}
{{- if .Values.rules.redis.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-cognigy-redis-rules
  labels:
    {{- include "cognigy-monitors.labels" . | nindent 4 }}
spec:
  groups:
  - name: cognigy.alert.redis
    rules:
    - alert: RedisDown
      expr: redis_up == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Redis down (instance {{`{{`}} $labels.instance }})
        description: "Redis instance is down\n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"

    # The percentage is the left operand of `and`, so $value is the percentage.
    - alert: RedisMemoryHigh
      expr: >
        (redis_memory_used_bytes{} * 100/redis_memory_max_bytes{} > 90) and (redis_memory_max_bytes{} > 0)
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Redis instance {{ "{{ $labels.instance }}" }} is using too much memory
        description: |
          Redis instance {{ "{{ $labels.instance }}" }} is using {{`{{`}} $value | printf "%.1f" }}% of its available memory

    {{- $memCritical := .Values.rules.redis.redisMemoryHigh.critical }}
    {{- if $memCritical.enabled }}

    # Same alert name, so Alertmanager inhibits the warning while this fires.
    # At 100% Redis evicts keys, shortest remaining TTL first.
    - alert: RedisMemoryHigh
      expr: >
        (redis_memory_used_bytes{namespace=~"{{ $memCritical.namespaces }}"} * 100/redis_memory_max_bytes{namespace=~"{{ $memCritical.namespaces }}"} > {{ $memCritical.threshold }}) and (redis_memory_max_bytes{namespace=~"{{ $memCritical.namespaces }}"} > 0)
      for: {{ $memCritical.timeout }}
      labels:
        severity: {{ $memCritical.severity }}
        group: vg-custom-alert-rules
      annotations:
        summary: Redis instance {{ "{{ $labels.instance }}" }} is about to run out of memory
        description: |
          Redis instance {{ "{{ $labels.instance }}" }} is using {{`{{`}} $value | printf "%.1f" }}% of its available memory. At 100% it starts evicting keys.
    {{- end }}

    {{- if (.Values.rules.redis.redisBlockedClients.enabled ) }}
    - alert: RedisBlockedClients
      expr: redis_blocked_clients > {{ $.Values.rules.redis.redisBlockedClients.threshold }}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Redis instance {{ "{{ $labels.instance }}" }} has blocked clients
        description: |
          Redis instance {{ "{{ $labels.instance }}" }} has blocked {{ "{{ $value }}" }} clients
    {{- end }}

    - alert: RedisContainerRestarted
      expr: increase(kube_pod_container_status_restarts_total{container="redis"}[5m]) > 0
      annotations:
        summary: Redis container in pod {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}} has restarted
        description: "Redis container in pod {{`{{`}} $labels.pod }} has restarted\n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"
      for: 2m
      labels:
        severity: warning

{{- end -}}