{{- $targetNamespace := .Values.appNamespacesTarget }}
{{- $otr := .Values.rules.kubernetes.ownerTeamRouting | default dict }}
{{- $teams := $otr.teams | default dict }}
{{- $routedTeams := keys $teams | sortAlpha | join "|" }}
{{- $pmr := .Values.rules.kubernetes.podManyRestarts }}
{{- $oom := .Values.rules.kubernetes.containerOOMKilled }}
{{- $cd := .Values.rules.kubernetes.criticalDatastores }}
{{- if and $otr.enabled (not $teams) }}
{{- fail "cognigy-alerts: rules.kubernetes.ownerTeamRouting.enabled is true but rules.kubernetes.ownerTeamRouting.teams is empty" }}
{{- end }}
{{- if .Values.rules.kubernetes.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-cognigy-kubernetes-rules
  labels:
    {{- include "cognigy-monitors.labels" . | nindent 4 }}
spec:
  groups:
  {{- if $otr.enabled }}
  # Ownership lookup. Requires kube-state-metrics to be started with
  # --metric-labels-allowlist=deployments=[owner-team],statefulsets=[owner-team]
  # and the kube-prometheus-stack default rule namespace_workload_pod:kube_pod_owner:relabel.
  - name: cognigy.rules.ownership
    rules:
    - record: cognigy:pod_owner_team:info
      expr: |-
        max by (namespace, pod, owner_team) (
          label_replace(
            namespace_workload_pod:kube_pod_owner:relabel{workload_type="deployment"}
            * on (namespace, workload) group_left(label_owner_team)
            max by (namespace, workload, label_owner_team) (
              label_replace(
                kube_deployment_labels{job="kube-state-metrics", label_owner_team!=""},
                "workload", "$1", "deployment", "(.+)"
              )
            ),
            "owner_team", "$1", "label_owner_team", "(.+)"
          )
          or
          label_replace(
            namespace_workload_pod:kube_pod_owner:relabel{workload_type="statefulset"}
            * on (namespace, workload) group_left(label_owner_team)
            max by (namespace, workload, label_owner_team) (
              label_replace(
                kube_statefulset_labels{job="kube-state-metrics", label_owner_team!=""},
                "workload", "$1", "statefulset", "(.+)"
              )
            ),
            "owner_team", "$1", "label_owner_team", "(.+)"
          )
        )

    - record: cognigy:container_oomkilled:sum
      expr: |-
        sum by (container, owner_team) (
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
          * on (namespace, pod) group_left(owner_team) cognigy:pod_owner_team:info
        )
        or
        sum by (container) (
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
          unless on (namespace, pod) cognigy:pod_owner_team:info
        )
  {{- end }}
  - name: cognigy.alert.host
    rules:
    - alert: HostUnusualNetworkThroughputIn
      expr: sum by (instance) (rate(node_network_receive_bytes_total[2m])) / 1024 / 1024 > 100
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Host unusual network throughput in (instance {{`{{`}} $labels.instance }})
        description: "Host network interfaces are probably receiving too much data (> 100 MB/s)\n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"

    - alert: HostUnusualNetworkThroughputOut
      expr: sum by (instance) (rate(node_network_transmit_bytes_total[2m])) / 1024 / 1024 > 100
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Host unusual network throughput out (instance {{`{{`}} $labels.instance }})
        description: "Host network interfaces are probably sending too much data (> 100 MB/s)\n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"

    - alert: HostHighCpuLoad
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Host high CPU load (instance {{`{{`}} $labels.instance }})
        description: "CPU load is > 80%\n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"

    - alert: HostOutOfMemory
      expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Host out of memory (instance {{`{{`}} $labels.instance }})
        description: "Node memory is filling up (< 10% left)\n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"


    - alert: HostMemoryUnderMemoryPressure
      expr: rate(node_vmstat_pgmajfault[1m]) > 1000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Host memory under memory pressure (instance {{`{{`}} $labels.instance }})
        description: "The node is under heavy memory pressure. High rate of major page faults\n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"

    - alert: HostCpuStealNoisyNeighbor
      expr: avg by(instance) (rate(node_cpu_seconds_total{mode="steal"}[5m])) * 100 > 10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Host CPU steal noisy neighbor (instance {{`{{`}} $labels.instance }})
        description: "CPU steal is > 10%. A noisy neighbor is killing VM performances or a spot instance may be out of credit.\n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"

  - name: cognigy.alert.k8s
    rules:
    {{- if (.Values.rules.kubernetes.kubeDeploymentReplicasMismatch.enabled ) }}
    - alert: KubeDeploymentReplicasMismatch
      annotations:
        description: Deployment {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.deployment {{`}}`}} has not matched the expected number of replicas for longer than 15 minutes.
        runbook_url: {{ .Values.runbookUrl }}alert-name-kubedeploymentreplicasmismatch
        summary: Deployment has not matched the expected number of replicas.
      expr: |-
        (
          kube_deployment_spec_replicas{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}"}
            >
          kube_deployment_status_replicas_available{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}"}
        ) and (
          changes(kube_deployment_status_replicas_updated{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}"}[10m])
            ==
          0
        )
      for: {{ .Values.rules.kubernetes.kubeDeploymentReplicasMismatch.timeout }}
      labels:
        severity: {{ .Values.rules.kubernetes.kubeDeploymentReplicasMismatch.severity }}
    {{- end }}

    {{- if (.Values.rules.kubernetes.kubeStatefulSetReplicasMismatch.enabled ) }}
    - alert: KubeStatefulSetReplicasMismatch
      annotations:
        description: StatefulSet {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.statefulset {{`}}`}} has not matched the expected number of replicas for longer than 15 minutes.
        runbook_url: {{ .Values.runbookUrl }}alert-name-kubestatefulsetreplicasmismatch
        summary: Deployment has not matched the expected number of replicas.
      expr: |-
        (
          kube_statefulset_status_replicas_ready{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}"}
            !=
          kube_statefulset_status_replicas{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}"}
        ) and (
          changes(kube_statefulset_status_replicas_updated{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}"}[10m])
            ==
          0
        )
      for: {{ .Values.rules.kubernetes.kubeStatefulSetReplicasMismatch.timeout }}
      labels:
        severity: {{ .Values.rules.kubernetes.kubeStatefulSetReplicasMismatch.severity }}
    {{- end }}

    {{- if (.Values.rules.kubernetes.kubePodCrashLooping.enabled ) }}
    - alert: KubePodCrashLooping
      annotations:
        description: Pod {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}} ({{`{{`}} $labels.container {{`}}`}}) is restarting {{`{{`}} printf "%.2f" $value {{`}}`}} times / 10 minutes.
        runbook_url: {{ .Values.runbookUrl }}alert-name-kubepodcrashlooping
        summary: Pod {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}} is crash looping.
      expr: >
        increase(kube_pod_container_status_restarts_total{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}"}[10m]) > 0
        and
        kube_pod_container_status_waiting{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}"} == 1
      for: 15m
      labels:
        severity: {{ .Values.rules.kubernetes.kubePodCrashLooping.severity }}
    {{- end }}

    {{- if (.Values.rules.kubernetes.kubePodNotReady.enabled ) }}
    - alert: KubePodNotReady
      annotations:
        description: Pod {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}} has been in a non-ready state for longer than 15 minutes.
        runbook_url: {{ .Values.runbookUrl }}alert-name-kubepodnotready
        summary: Pod has been in a non-ready state for more than 15 minutes.
      expr: |-
        sum by (namespace, pod) (
          max by(namespace, pod) (
            kube_pod_status_phase{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}", phase=~"Pending|Unknown"}
          ) * on(namespace, pod) group_left(owner_kind) topk by(namespace, pod) (
            1, max by(namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"})
          )
        ) > 0
      for: {{ .Values.rules.kubernetes.kubePodNotReady.timeout }}
      labels:
        severity: {{ .Values.rules.kubernetes.kubePodNotReady.severity }}
    {{- end }}

    {{- if (.Values.rules.kubernetes.podManyRestarts.enabled ) }}
    {{- if $otr.enabled }}
    {{- range $team, $group := $teams }}
    - alert: PodManyRestarts
      expr: |-
        (
          (increase(kube_pod_container_status_restarts_total{container!~"{{ $pmr.containerBlacklist }}"}[60m]) > {{ $pmr.restartsPerHour }})
          or (kube_pod_container_status_restarts_total{container!~"{{ $pmr.containerBlacklist }}"} > {{ $pmr.restartsTotal }})
        )
        and on(namespace, pod) cognigy:pod_owner_team:info{owner_team="{{ $team }}"}
      annotations:
        summary: Pod {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}} restarts too often.
        description: "Pod {{`{{`}} $labels.pod }} restarts \n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"
        runbook_url: {{ $.Values.runbookUrl }}alert-name-kubepodcrashlooping
      for: {{ $pmr.timeout }}
      labels:
        severity: {{ $pmr.severity }}
        group: {{ $group }}
        owner_team: {{ $team }}
    {{- end }}
    # Fallback: pods with no owner-team label, or owned by a team that has no route.
    - alert: PodManyRestarts
      expr: |-
        (
          (increase(kube_pod_container_status_restarts_total{container!~"{{ $pmr.containerBlacklist }}"}[60m]) > {{ $pmr.restartsPerHour }})
          or (kube_pod_container_status_restarts_total{container!~"{{ $pmr.containerBlacklist }}"} > {{ $pmr.restartsTotal }})
        )
        unless on(namespace, pod) cognigy:pod_owner_team:info{owner_team=~"{{ $routedTeams }}"}
      annotations:
        summary: Pod {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}} restarts too often.
        description: "Pod {{`{{`}} $labels.pod }} restarts \n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"
        runbook_url: {{ $.Values.runbookUrl }}alert-name-kubepodcrashlooping
      for: {{ $pmr.timeout }}
      labels:
        severity: {{ $pmr.severity }}
    {{- else }}
    - alert: PodManyRestarts
      expr: (increase(kube_pod_container_status_restarts_total{container!~"{{ .Values.rules.kubernetes.podManyRestarts.containerBlacklist }}"}[60m]) > {{.Values.rules.kubernetes.podManyRestarts.restartsPerHour}})
            or (kube_pod_container_status_restarts_total{container!~"{{ .Values.rules.kubernetes.podManyRestarts.containerBlacklist }}"} > {{.Values.rules.kubernetes.podManyRestarts.restartsTotal}})
      annotations:
        summary: Pod {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}} restarts too often.
        description: "Pod {{`{{`}} $labels.pod }} restarts \n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"
        runbook_url: {{ .Values.runbookUrl }}alert-name-kubepodcrashlooping
      for: {{ .Values.rules.kubernetes.podManyRestarts.timeout }}
      labels:
        severity: {{ .Values.rules.kubernetes.podManyRestarts.severity }}
    {{- end }}
    {{- end }}

    {{- if (.Values.rules.kubernetes.containerOOMKilled.enabled ) }}
    {{- if $otr.enabled }}
    {{- range $team, $group := $teams }}
    - alert: ContainerSingleOOMKilled
      expr: |-
        (cognigy:container_oomkilled:sum{owner_team="{{ $team }}", container!~"{{ $oom.containerSingleOOMBlacklist }}"}) > 1
        UNLESS ((cognigy:container_oomkilled:sum{owner_team="{{ $team }}", container!~"{{ $oom.containerSingleOOMBlacklist }}"}) -
        (cognigy:container_oomkilled:sum{owner_team="{{ $team }}", container!~"{{ $oom.containerSingleOOMBlacklist }}"}
         offset {{ $oom.offset }}) == 0)
      annotations:
        summary: Container /{{`{{`}} $labels.container {{`}}`}} OOMKilled {{`{{`}} $value {{`}}`}} times
        description: "Container {{`{{`}} $labels.container }} OOMKilled {{`{{`}} $value }} times \n LABELS = {{`{{`}} $labels }}"
      for: {{ $oom.timeout }}
      labels:
        severity: {{ $oom.severity }}
        group: {{ $group }}
        owner_team: {{ $team }}

    - alert: ContainerMultiOOMKilled
      expr: |-
        (cognigy:container_oomkilled:sum{owner_team="{{ $team }}", container=~"{{ $oom.containerMultiOOMWhitelist }}"}) >
        {{ $oom.threshold }}
        UNLESS ((cognigy:container_oomkilled:sum{owner_team="{{ $team }}", container=~"{{ $oom.containerMultiOOMWhitelist }}"}) -
        (cognigy:container_oomkilled:sum{owner_team="{{ $team }}", container=~"{{ $oom.containerMultiOOMWhitelist }}"}
         offset {{ $oom.offset }}) == 0)
      annotations:
        summary: Container /{{`{{`}} $labels.container {{`}}`}} OOMKilled {{`{{`}} $value {{`}}`}} times
        description: "Container {{`{{`}} $labels.container }} OOMKilled {{`{{`}} $value }} times \n LABELS = {{`{{`}} $labels }}"
      for: {{ $oom.timeout }}
      labels:
        severity: {{ $oom.severity }}
        group: {{ $group }}
        owner_team: {{ $team }}
    {{- end }}
    # Fallbacks: containers with no owner-team label, or owned by a team that has no
    # route. The matcher must be !~ over the routed teams, NOT owner_team="" - an
    # unrouted team has owner_team set and would otherwise match no rule at all.
    - alert: ContainerSingleOOMKilled
      expr: |-
        (cognigy:container_oomkilled:sum{owner_team!~"{{ $routedTeams }}", container!~"{{ $oom.containerSingleOOMBlacklist }}"}) > 1
        UNLESS ((cognigy:container_oomkilled:sum{owner_team!~"{{ $routedTeams }}", container!~"{{ $oom.containerSingleOOMBlacklist }}"}) -
        (cognigy:container_oomkilled:sum{owner_team!~"{{ $routedTeams }}", container!~"{{ $oom.containerSingleOOMBlacklist }}"}
         offset {{ $oom.offset }}) == 0)
      annotations:
        summary: Container /{{`{{`}} $labels.container {{`}}`}} OOMKilled {{`{{`}} $value {{`}}`}} times
        description: "Container {{`{{`}} $labels.container }} OOMKilled {{`{{`}} $value }} times \n LABELS = {{`{{`}} $labels }}"
      for: {{ $oom.timeout }}
      labels:
        severity: {{ $oom.severity }}

    - alert: ContainerMultiOOMKilled
      expr: |-
        (cognigy:container_oomkilled:sum{owner_team!~"{{ $routedTeams }}", container=~"{{ $oom.containerMultiOOMWhitelist }}"}) >
        {{ $oom.threshold }}
        UNLESS ((cognigy:container_oomkilled:sum{owner_team!~"{{ $routedTeams }}", container=~"{{ $oom.containerMultiOOMWhitelist }}"}) -
        (cognigy:container_oomkilled:sum{owner_team!~"{{ $routedTeams }}", container=~"{{ $oom.containerMultiOOMWhitelist }}"}
         offset {{ $oom.offset }}) == 0)
      annotations:
        summary: Container /{{`{{`}} $labels.container {{`}}`}} OOMKilled {{`{{`}} $value {{`}}`}} times
        description: "Container {{`{{`}} $labels.container }} OOMKilled {{`{{`}} $value }} times \n LABELS = {{`{{`}} $labels }}"
      for: {{ $oom.timeout }}
      labels:
        severity: {{ $oom.severity }}
    {{- else }}
    - alert: ContainerSingleOOMKilled
      expr: |-
        (sum by (container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container!~"{{ .Values.rules.kubernetes.containerOOMKilled.containerSingleOOMBlacklist }}"})) > 1
        UNLESS ((sum by (container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container!~"{{ .Values.rules.kubernetes.containerOOMKilled.containerSingleOOMBlacklist }}"})) -
        (sum by (container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container!~"{{ .Values.rules.kubernetes.containerOOMKilled.containerSingleOOMBlacklist }}"}
         offset {{ .Values.rules.kubernetes.containerOOMKilled.offset }})) == 0)
      annotations:
        summary: Container /{{`{{`}} $labels.container {{`}}`}} OOMKilled {{`{{`}} $value {{`}}`}} times
        description: "Container {{`{{`}} $labels.container }} OOMKilled {{`{{`}} $value }} times \n LABELS = {{`{{`}} $labels }}"
      for: {{ .Values.rules.kubernetes.containerOOMKilled.timeout }}
      labels:
        severity: {{ .Values.rules.kubernetes.containerOOMKilled.severity }}

    - alert: ContainerMultiOOMKilled
      expr: |-
        (sum by (container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container=~"{{ .Values.rules.kubernetes.containerOOMKilled.containerMultiOOMWhitelist }}"})) >
        {{ .Values.rules.kubernetes.containerOOMKilled.threshold }}
        UNLESS ((sum by (container, cluster) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container=~"{{ .Values.rules.kubernetes.containerOOMKilled.containerMultiOOMWhitelist }}"})) -
        (sum by (container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled", container=~"{{ .Values.rules.kubernetes.containerOOMKilled.containerMultiOOMWhitelist }}"}
         offset {{ .Values.rules.kubernetes.containerOOMKilled.offset }})) == 0)
      annotations:
        summary: Container /{{`{{`}} $labels.container {{`}}`}} OOMKilled {{`{{`}} $value {{`}}`}} times
        description: "Container {{`{{`}} $labels.container }} OOMKilled {{`{{`}} $value }} times \n LABELS = {{`{{`}} $labels }}"
      for: {{ .Values.rules.kubernetes.containerOOMKilled.timeout }}
      labels:
        severity: {{ .Values.rules.kubernetes.containerOOMKilled.severity }}
    {{- end }}
    {{- end }}

    {{- if (.Values.rules.kubernetes.cpuThrottlingBackendServiceHigh.enabled ) }}
    - alert: CPUThrottlingBackendServiceHigh
      annotations:
        description: '{{`{{`}} $value | humanizePercentage {{`}}`}} throttling of CPU in namespace {{`{{`}} $labels.namespace {{`}}`}} for container {{`{{`}} $labels.container {{`}}`}} in pod {{`{{`}} $labels.pod {{`}}`}}.'
        runbook_url: {{ .Values.runbookUrl }}alert-name-cputhrottlinghigh
        summary: Processes experience elevated CPU throttling.
      expr: |-
        sum(increase(container_cpu_cfs_throttled_periods_total{container!="metrics", pod=~"{{ .Values.rules.kubernetes.cpuThrottlingBackendServiceHigh.monitoredPods }}"}[5m])) by (container, pod, namespace)
          /
        sum(increase(container_cpu_cfs_periods_total{}[5m])) by (container, pod, namespace)
          > ( 25 / 100 )
      for: {{ .Values.rules.kubernetes.cpuThrottlingBackendServiceHigh.timeout }}
      labels:
        severity: {{ .Values.rules.kubernetes.cpuThrottlingBackendServiceHigh.severity }}
    {{- end }}

    {{- if (.Values.rules.kubernetes.hpaMaxReplicasReached.enabled ) }}
    - alert: HPAMaxReplicasReached
      annotations:
        description: '"HorizontalPodAutoscaler {{`{{`}} $labels.horizontalpodautoscaler }} has reached the limit of max replicas, free replicas are:\n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}".'
        summary: HPA {{`{{`}} $labels.horizontalpodautoscaler }} reached max replicas.
      expr: |-
        kube_horizontalpodautoscaler_spec_max_replicas{} - kube_horizontalpodautoscaler_status_current_replicas{} == 0
      for: {{ .Values.rules.kubernetes.hpaMaxReplicasReached.timeout }}
      labels:
        severity: {{ .Values.rules.kubernetes.hpaMaxReplicasReached.severity }}
    {{- end }}

    {{- if $cd.enabled }}
    # Critical, high-urgency coverage for stateful datastores (pattern above),
    # additive to the generic warning-severity rules - see values.yaml.
    - alert: KubeStatefulSetReplicasMismatchCritical
      annotations:
        description: StatefulSet {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.statefulset {{`}}`}} is a critical stateful datastore and has not matched the expected number of replicas for longer than {{ $cd.statefulSetReplicasMismatch.timeout }}.
        runbook_url: {{ .Values.runbookUrl }}alert-name-kubestatefulsetreplicasmismatch
        summary: Critical datastore StatefulSet has not matched the expected number of replicas.
      expr: |-
        (
          kube_statefulset_status_replicas_ready{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}", statefulset=~"{{ $cd.pattern }}"}
            !=
          kube_statefulset_status_replicas{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}", statefulset=~"{{ $cd.pattern }}"}
        ) and (
          changes(kube_statefulset_status_replicas_updated{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}", statefulset=~"{{ $cd.pattern }}"}[{{ $cd.statefulSetReplicasMismatch.timeout }}])
            ==
          0
        )
      for: {{ $cd.statefulSetReplicasMismatch.timeout }}
      labels:
        severity: {{ $cd.severity }}

    # Doesn't depend on the container being in `waiting` state (unlike
    # KubePodCrashLooping), so it also catches a crash loop where the container
    # spends most of its cycle `Running` before being killed.
    - alert: PodManyRestartsCritical
      annotations:
        summary: Pod {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}} (critical datastore) restarts too often.
        description: "Pod {{`{{`}} $labels.pod }} restarts \n  VALUE = {{`{{`}} $value }}\n  LABELS = {{`{{`}} $labels }}"
        runbook_url: {{ .Values.runbookUrl }}alert-name-kubepodcrashlooping
      expr: |-
        (increase(kube_pod_container_status_restarts_total{namespace=~"{{ $targetNamespace }}", container=~"{{ $cd.pattern }}"}[15m]) > {{ $cd.podManyRestarts.restartsPerHour }})
        or
        (kube_pod_container_status_restarts_total{namespace=~"{{ $targetNamespace }}", container=~"{{ $cd.pattern }}"} > {{ $cd.podManyRestarts.restartsTotal }})
      for: {{ $cd.podManyRestarts.timeout }}
      labels:
        severity: {{ $cd.severity }}

    # Unlike KubePodNotReady, matches on the `Ready` condition directly instead
    # of `phase` - catches a pod stuck `Running` with a container that never
    # becomes ready, which KubePodNotReady (phase=~"Pending|Unknown") cannot see.
    - alert: KubePodNotReadyCritical
      annotations:
        description: Pod {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}} is a critical datastore pod and has not been Ready for longer than {{ $cd.podNotReady.timeout }}.
        runbook_url: {{ .Values.runbookUrl }}alert-name-kubepodnotready
        summary: Critical datastore pod has not been ready.
      expr: |-
        max by (namespace, pod) (
          kube_pod_status_ready{job="kube-state-metrics", namespace=~"{{ $targetNamespace }}", pod=~"{{ $cd.pattern }}", condition="false"}
        ) == 1
      for: {{ $cd.podNotReady.timeout }}
      labels:
        severity: {{ $cd.severity }}
    {{- end }}

{{- end -}}