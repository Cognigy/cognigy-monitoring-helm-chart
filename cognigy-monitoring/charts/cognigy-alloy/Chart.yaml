apiVersion: v2
name: cognigy-alloy
description: >-
  Renders the Grafana Alloy River configuration for the Tempo trace-ingest
  edge collector. Owns only the ConfigMap; the collector workload itself is
  the vendored `alloy` subchart, deployed alongside this one from the
  cognigy-monitoring umbrella chart.
type: application
