---
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cognigy-monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  config.alloy: |
    {{- include "cognigy-alloy.config" . | nindent 4 }}
{{- end -}}
