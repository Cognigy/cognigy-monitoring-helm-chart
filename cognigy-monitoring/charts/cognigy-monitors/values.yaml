---
monitors:
  rabbitmq:
    enabled: true
    namespace: "cognigy-ai"
  rabbitmqDetailed:
    enabled: true
    namespace: "cognigy-ai"
    metricsList:
      - queue_coarse_metrics
      - queue_consumer_count
  traefik:
    enabled: true
    namespace: "cognigy-ai"
  kubecost:
    enabled: false
  fluxcd:
    enabled: false
    namespace: "flux-system"
  sealedSecrets:
    enabled: false
    namespace: "flux-system"
  awsClusterAutoscaler:
    enabled: false
    namespace: "kube-system"
  postgresHa:
    enabled: false
    namespace: "cognigy-ai"
  postgresHaPatroni:
    enabled: false
    namespace: "cognigy-ai"
