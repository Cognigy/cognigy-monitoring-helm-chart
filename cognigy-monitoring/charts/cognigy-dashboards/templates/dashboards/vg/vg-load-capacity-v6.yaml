{{- /*
Generated from json dashboard 'dashboards/vg/vg-load-capacity-v6.json'.
Do not change in-place! In order to change this file first modify the json dashboard 'dashboards/vg/vg-load-capacity-v6.json'
and then run the 'scripts/convert-dashboard/convert-dashboard.py' script.
*/ -}}
{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and 
    (index .Values "products" "vg" "enabled")
    (index .Values "products" "vg" "dashboards" "vg-load-capacity-v6" "enabled")
    (index .Values "products" "vg" "dashboards" "vg-load-capacity-v6" "yamlVersion")
    (not .Values.forceDeployJsonDashboards)
    (semverCompare ">=1.14.0-0" $kubeTargetVersion)
    (semverCompare "<9.9.9-9" $kubeTargetVersion)
     
}}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ template "cognigy-dashboards.namespace" . }}
  name: {{ printf "%s-%s" (include "cognigy-dashboards.fullname" $) "vg-load-capacity-v6" | trunc 63 | trimSuffix "-" }}
  {{- with $.Values.grafana.sidecar.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- if $.Values.grafana.sidecar.dashboards.label }}
    {{ $.Values.grafana.sidecar.dashboards.label }}: {{ ternary $.Values.grafana.sidecar.dashboards.labelValue "1" (not (empty $.Values.grafana.sidecar.dashboards.labelValue)) | quote }}
    {{- end }}
    app: {{ template "cognigy-dashboards.name" $ }}-grafana
    {{- include "cognigy-dashboards.labels" $ | nindent 4 }}
data:
  vg-load-capacity-v6.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 99,
          "panels": [],
          "title": "How Many More Calls Can We Take Right Now?",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Calls currently in progress across the whole environment, right now.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 100,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum(vg_feature_server_call_session_count{cluster=\"$cluster\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "\ud83d\udcde Calls In Progress Right Now",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Total safe concurrent-call capacity of the environment as currently sized: (number of feature-server instances running) \u00d7 (safe calls per instance, $safe_calls_per_pod \u2014 set via the dashboard variable, based on the measured, load-tested safe concurrency for this account's real traffic profile and STT vendor).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 101,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "($safe_calls_per_pod * count(kube_pod_info{cluster=\"$cluster\", namespace=\"voicegateway\", pod=~\"feature-server-.*\"}))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "\ud83d\udee1\ufe0f Safe Capacity Right Now (Total)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "The headline number: how many MORE concurrent calls this environment can safely take on right now, on top of what's already running \u2014 before reaching the load-tested safe limit. Calculated as Safe Capacity minus Calls In Progress.\n\nThresholds:\n- Green: healthy margin\n- Yellow (<15% of safe capacity remaining): margin is thin\n- Red (\u22640): at or over the safe limit \u2014 do not use this reading alone, cross-check with the CPU Throttling Ratio panel below.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": "$safe_calls_per_pod"
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 102,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "clamp_min(($safe_calls_per_pod * count(kube_pod_info{cluster=\"$cluster\", namespace=\"voicegateway\", pod=~\"feature-server-.*\"})) - (sum(vg_feature_server_call_session_count{cluster=\"$cluster\"})), 0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "\u2705 Additional Calls Available Right Now",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Current load as a percentage of safe capacity \u2014 a fuller bar means less room before the load-tested safe limit. Same underlying numbers as the three panels to the left, shown as a single fill level for an at-a-glance read.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 103,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "100 * (sum(vg_feature_server_call_session_count{cluster=\"$cluster\"})) / (($safe_calls_per_pod * count(kube_pod_info{cluster=\"$cluster\", namespace=\"voicegateway\", pod=~\"feature-server-.*\"})))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "\ud83d\udcca Current Load (% of Safe Capacity)",
          "type": "gauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Concurrent calls over the selected time range, plotted directly against the safe-capacity limit line (dashed) \u2014 the limit line itself tracks actual running replica count at each point in time, so a scale-up/scale-down event moves the line, not just the data. Widen the time range (e.g. Last 7 days) to prove the load stayed under the safe limit throughout, not just right now.\n\nIf the green area ever touches or crosses the dashed line, that is the moment to cross-check against the CPU Throttling Ratio panel below for the same time window.\n\n\u26a0\ufe0f This number will be LOWER than the 'Active Sessions by Account' panel below \u2014 that's expected, not a bug. This counts only sessions actively running the AI conversation on feature-server. The panel below counts SBC-layer sessions (ringing, IVR/DTMF, hold, voicemail, fallback) which include calls that haven't reached \u2014 or never reach \u2014 the AI engine. See that panel's tooltip for the full funnel explanation.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 25,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Safe Capacity Limit"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        10,
                        10
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Active Concurrent Calls"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "id": 104,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum(vg_feature_server_call_session_count{cluster=\"$cluster\"})",
              "legendFormat": "Active Concurrent Calls",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "($safe_calls_per_pod * count(kube_pod_info{cluster=\"$cluster\", namespace=\"voicegateway\", pod=~\"feature-server-.*\"}))",
              "legendFormat": "Safe Capacity Limit",
              "refId": "B"
            }
          ],
          "title": "\ud83d\udcc8 Active Concurrent Calls vs. Safe Capacity Limit \u2014 Over Time",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Active sessions broken down by account, stacked. Shows which accounts are driving SBC-layer traffic \u2014 same underlying gauge as the SBC dashboards.\n\nThis is expected to read HIGHER than 'Active Concurrent Calls' above (e.g. 300 vs 70) \u2014 not double-counting, just a wider definition of 'active':\n\n\u2022 This panel (sbc_active_sessions_gauge): an app-level counter inside the sbc-inbound Node.js service, inc/dec'd on session start/end. Includes calls still ringing, in early media, doing IVR/DTMF menu navigation, on hold, or routed to voicemail/fallback \u2014 none of which touch the AI engine.\n\u2022 'Active Concurrent Calls' (feature-server): only counts sessions actively running the AI conversation. Only this subset counts toward safe-capacity headroom.\n\nCross-check against drachtio_stable_dialogs (reported independently by the drachtio SIP server itself, not this counter) for a second read on the true SBC-layer session count.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "bars",
                "fillOpacity": 100,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 0,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "id": 105,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Last *",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum by (account_name) (sbc_active_sessions_gauge{cluster=\"$cluster\", account_name!~\".*test-call-manager.*\"})",
              "legendFormat": "{{`{{`}}account_name{{`}}`}}",
              "refId": "A"
            }
          ],
          "title": "\ud83d\udc65 Active Sessions by Account (Stacked)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "id": 2,
          "panels": [],
          "title": "\ud83d\udcc8 Capacity Headroom \u2014 The Proof",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Fraction of CPU periods where the FreeSWITCH sidecar was throttled by its CFS quota \u2014 the same query as the `CPUThrottlingVGServiceHigh` alert rule. This is the actual failure signal from the E.ON incident (~32% throttling ratio observed), not CPU usage %.\n\nThresholds:\n- Green (0%): no throttling\n- Yellow (>5%): early throttling, investigate\n- Red (>20%): approaching the incident's ~32% throttling ratio \u2014 audio degradation risk\n\nAction if Red: check Active Concurrent Call Sessions and Replica Count panels \u2014 determine if HPA should have already scaled out.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "decimals": 2,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "100 * sum(rate(container_cpu_cfs_throttled_periods_total{cluster=\"$cluster\", namespace=\"voicegateway\", pod=~\"feature-server-.*\", container=\"freeswitch\"}[5m])) by (pod)\n/\nsum(rate(container_cpu_cfs_periods_total{cluster=\"$cluster\", namespace=\"voicegateway\", pod=~\"feature-server-.*\", container=\"freeswitch\"}[5m])) by (pod)",
              "legendFormat": "{{`{{`}}pod{{`}}`}}",
              "refId": "A"
            }
          ],
          "title": "\ud83d\udd25 CPU Throttling Ratio (FreeSWITCH sidecar)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "FreeSWITCH container memory as a percentage of its configured limit. The `022` load-test run found FreeSWITCH memory (not CPU) was the real ceiling at 500 concurrent calls, ending in an OOM kill.\n\nThresholds:\n- Green (<70%): healthy\n- Yellow (70-90%): approaching limit\n- Red (>90%): risk of OOMKill\n\nAction if Red: check OOM Kills panel; consider raising the FreeSWITCH memory limit (capacity-planning lever, not a code fix, per `023`).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "decimals": 2,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "100 * sum(container_memory_working_set_bytes{cluster=\"$cluster\", namespace=\"voicegateway\", pod=~\"feature-server-.*\", container=\"freeswitch\"}) by (pod)\n/\nsum(kube_pod_container_resource_limits{cluster=\"$cluster\", namespace=\"voicegateway\", pod=~\"feature-server-.*\", container=\"freeswitch\", resource=\"memory\"}) by (pod)",
              "legendFormat": "{{`{{`}}pod{{`}}`}}",
              "refId": "A"
            }
          ],
          "title": "\ud83e\udde0 FreeSWITCH Sidecar Memory (% of limit)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
