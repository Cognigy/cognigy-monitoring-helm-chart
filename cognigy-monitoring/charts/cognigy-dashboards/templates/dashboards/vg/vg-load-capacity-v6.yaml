          "description": "FreeSWITCH records, per call, the largest gap between two RTP packets it sent to the caller. Of the calls that ended in each 15-minute window, the share whose largest gap was:\n- 60\u2013200 ms: a short stutter, if audio was playing at the time\n- 200 ms\u20131 s: a dropout, if audio was playing at the time\n- over 1 s: mostly pauses in sending, not CPU\n\nNot yet confirmed: how many of these gaps fall while the caller should hear speech, and how many while FreeSWITCH simply had nothing to send. vg-us shows 11\u201315% of calls in the 200 ms\u20131 s band at every hour (2026-11-03), too steady to be CPU. Use the trend against load, not the level, until a call capture settles it.\n\nA FreeSWITCH short of CPU shows as the first two bands rising with calls per pod (see the panel above). They are not zero on a healthy cluster: vg-eu 9% and vg-us 18% of calls in 60\u2013500 ms over 24 h (2026-11-03), while FreeSWITCH throttling stayed below 0.5%.\n\nWindows with fewer than 20 calls are blank. Needs vg-freeswitch 2026.22.0 or later; older clusters show no data.",
