              "editorMode": "code",
              "expr": "sum(max_over_time(kube_pod_container_status_last_terminated_reason{cluster=\"$cluster\", namespace=\"$namespace\", container=\"silero-vad\", reason=\"OOMKilled\"}[$__range]))",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
