              "expr": "go_goroutines{cluster=\"$cluster\", namespace=\"$namespace\", pod=~\"silero-vad.*\", pod=~\"$pod\"}",
              "instant": false,
              "legendFormat": "{{`{{`}}pod{{`}}`}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Goroutines per Pod",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "In-flight WebSocket sessions. If this never returns to baseline, sessions/connections are leaking. If it tracks call volume and memory tracks it, the growth is load, not a leak.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 4,
                "gradientMode": "opacity",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "custom_fillOpacity": 4,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 30
          },
          "id": 14,
          "options": {
            "legend": {
              "calcs": [
                "last",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "silero_vad_active_sessions{cluster=\"$cluster\", namespace=\"$namespace\", pod=~\"silero-vad.*\", pod=~\"$pod\"}",
              "instant": false,
              "legendFormat": "{{`{{`}}pod{{`}}`}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Active VAD Sessions per Pod",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Working set divided by concurrent sessions. Flat = memory scales with load (healthy). Rising while sessions are flat/falling = a genuine leak.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 4,
                "gradientMode": "opacity",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "custom_fillOpacity": 4,
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 30
          },
          "id": 15,
          "options": {
            "legend": {
              "calcs": [
                "last",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum(container_memory_working_set_bytes{cluster=\"$cluster\", namespace=\"$namespace\", container=\"silero-vad\", pod=~\"$pod\"}) / clamp_min(sum(silero_vad_active_sessions{cluster=\"$cluster\", namespace=\"$namespace\", pod=~\"silero-vad.*\"}), 1)",
              "instant": false,
              "legendFormat": "bytes/session",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Memory per Active Session (leak vs load)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
