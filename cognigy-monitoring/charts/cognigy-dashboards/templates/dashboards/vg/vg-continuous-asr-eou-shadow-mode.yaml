          "description": "How shadow mode works: on sampled VAD-less continuous-ASR calls, the Silero fork runs observe-only. When Silero fires speech_stopped, the timestamp is recorded but nothing happens in the real path \u2014 the turn stays open and closes normally via vendor final transcript or asrTimeout. delta_ms = t_silero_speech_stopped \u2212 t_real_legacy_close. Negative = Silero detected end-of-speech that many ms before the real close (snappier). Positive = real close came first (Silero lagging or missed). Important: the advance shown is the theoretical maximum. With VAD EOU enabled, production savings are capped at asrTimeout (typically 800\u20132000 ms) because the code waits at most asrTimeout ms for the vendor to catch up after Silero fires. Deltas larger than asrTimeout occur when interim transcripts keep resetting the timer, but the production path would still commit at the asrTimeout boundary. Mass concentrated left of 0 ms = strong case for enabling VAD EOU. Cell values show turn counts per 5-minute window (window fixed regardless of the time-picker range \u2014 heatmap constraint). Y-axis labels use Grafana ms auto-format: values \u2265 1 s display as seconds (e.g. -2 s), smaller values stay in ms.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "scaleDistribution": {
                  "type": "linear"
                }
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 18,
            "x": 0,
            "y": 1
