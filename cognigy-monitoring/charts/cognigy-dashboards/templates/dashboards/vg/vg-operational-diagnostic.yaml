          "panels": [
            {
              "description": "Legend for the Hypercare Agent Monitoring row: what each pair of panels shows and how vg-pagerduty-agent's hypercare checks differ from the standing Alert Verification row above.",
              "fieldConfig": {
                "defaults": {},
                "overrides": []
              },
              "gridPos": {
                "h": 9,
                "w": 24,
                "x": 0,
                "y": 1
