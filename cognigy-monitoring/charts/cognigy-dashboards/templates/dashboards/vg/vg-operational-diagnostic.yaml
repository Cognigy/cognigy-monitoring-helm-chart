      "description": "Diagnostic dashboard for Voice Gateway operations. Surfaces deployment versions, known failure patterns, and actionable alerts to help dev and support teams quickly identify and resolve issues. Designed for cross-cluster comparison \u2014 cluster variable is multi-select; unlike other VG dashboards which are single-cluster.",
