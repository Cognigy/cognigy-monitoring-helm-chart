              "id": 205,
              "options": {
                "code": {
                  "language": "plaintext",
                  "showLineNumbers": false,
                  "showMiniMap": false
                },
                "content": "## How to read this row\n\nThis row visualizes the **Hypercare Agent** (`vg-pagerduty-agent`) golden metrics -- the checks it runs every 10 minutes against a release's target environment(s) during a post-deploy hypercare window (default 2h, configurable per environment via `vgPagerdutyAgent.hypercare`). Unlike the **Alert Verification** row above, these are not standing Prometheus alerting rules -- they are evaluated in the agent's own code and reported to VG Console -> Incident Management -> Hypercare Reports, with warning/critical findings opening PagerDuty incidents.\n\n**The two panels per metric**\n\n| Panel | Plots | Use it to |\n|-------|-------|-----------|\n| **... -- signal vs threshold** | The raw metric (or current-vs-baseline for ratio checks) with orange (warning) / red (critical) threshold lines | Calibrate -- is the threshold too loose or too tight vs real traffic? |\n| **... -- firing expression** | The exact gated breach condition per severity (thresholds plus any volume guard) | Verify -- does the full condition actually trigger on a real event? Series appear only while that severity would fire. |\n\n`active_sessions` is a ratio-vs-baseline (\"below\") check: it fires when current sessions drop **below** a fraction of the same time yesterday, gated by minimum baseline size and minimum absolute drop so low-traffic clusters don't false-page. All other metrics fire **above** a fixed threshold. `user_input_timeout_rate` and `calls_with_timeout_ratio` additionally require a minimum cluster-wide event volume before either severity may fire, and `user_input_timeout_rate` can also be promoted by a single account's breach -- see the report's per-account breakdown for that path.",
                "mode": "markdown"
              },
              "pluginVersion": "12.0.2",
              "title": "About these graphs",
              "type": "text"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "description": "Active voice sessions vs the same time yesterday. Hypercare treats a ratio drop as WARNING when current/baseline <= 0.5 (only if baseline >= 50 and the absolute drop >= 30), and CRITICAL when <= 0.2 (only if baseline >= 200 and drop >= 100). This is a ratio+volume-gated check evaluated by vg-pagerduty-agent during a post-release hypercare window, not a standing Prometheus alert.",
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "axisBorderShow": false,
                    "axisCenteredZero": false,
                    "axisColorMode": "text",
                    "axisLabel": "",
                    "axisPlacement": "auto",
                    "barAlignment": 0,
