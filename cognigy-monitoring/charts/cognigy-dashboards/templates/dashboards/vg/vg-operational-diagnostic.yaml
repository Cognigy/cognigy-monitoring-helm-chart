                "content": "## SIP Error Code Reference\n\n### 4xx \u2014 Client Errors\n| Code | Description |\n|------|-------------|\n| 400 | Bad Request \u2014 malformed syntax |\n| 401 | Unauthorized \u2014 valid credentials required |\n| 403 | Forbidden \u2014 server understood but refuses to fulfill |\n| 404 | Not Found \u2014 user does not exist at the domain |\n| 405 | Method Not Allowed |\n| 407 | Proxy Authentication Required |\n| 408 | Request Timeout \u2014 could not produce a response in time |\n| 415 | Unsupported Media Type |\n| 480 | Temporarily Unavailable \u2014 callee not reachable |\n| 481 | Call/Transaction Does Not Exist |\n| 482 | Loop Detected |\n| 483 | Too Many Hops \u2014 Max-Forwards reached zero |\n| 484 | Address Incomplete \u2014 Request-URI is incomplete |\n| 486 | Busy Here \u2014 callee is busy |\n| 487 | Request Terminated \u2014 BYE or CANCEL received |\n| 488 | Not Acceptable Here \u2014 some aspect of session description not acceptable |\n| 491 | Request Pending \u2014 server has pending request for this dialog |\n\n### 5xx \u2014 Server Errors\n| Code | Description |\n|------|-------------|\n| 500 | Server Internal Error |\n| 501 | Not Implemented \u2014 method not supported |\n| 502 | Bad Gateway \u2014 received an invalid response from downstream |\n| 503 | Service Unavailable \u2014 server in maintenance or overloaded |\n| 504 | Server Time-out \u2014 no timely response from downstream |\n| 513 | Message Too Large |\n\n### 6xx \u2014 Global Failures\n| Code | Description |\n|------|-------------|\n| 600 | Busy Everywhere \u2014 callee is busy at all locations |\n| 603 | Decline \u2014 callee explicitly does not wish to be contacted |\n| 604 | Does Not Exist Anywhere |\n| 606 | Not Acceptable \u2014 callee's capabilities are incompatible |",
