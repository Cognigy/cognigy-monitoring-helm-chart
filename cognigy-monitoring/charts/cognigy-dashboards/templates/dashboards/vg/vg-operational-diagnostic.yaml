                "code": {
                  "language": "plaintext",
                  "showLineNumbers": false,
                  "showMiniMap": false
                },
                "content": "## How to read this row\n\nEach alert in `cognigy.vg.rules.yaml` gets **two panels side by side**. Hover any panel's **\u24d8** icon for its exact severity and fire direction.\n\n**Threshold line color = alert severity**\n\n| Line | Severity | Meaning |\n|------|----------|---------|\n| \ud83d\udfe7 Orange | `warning` | Degradation \u2014 investigate |\n| \ud83d\udfe5 Red | `critical` | Service-impacting \u2014 act now (only `TaskErrorsFeatureServer` and `FeatureServerESLEventLoopFreeze`) |\n\nMost alerts fire when the signal rises **above** the line. Four fire when it drops **below** (STT/TTS frame rate, low MOS) \u2014 the panel description says which.\n\n**The two panels per alert**\n\n| Panel | Plots | Shows data | Use it to |\n|-------|-------|-----------|-----------|\n| **\u2026 \u2014 signal vs threshold** | The live metric vs the threshold line | **Always** | **Calibrate** \u2014 is the line too loose or too tight vs real traffic? |\n| **\u2026 \u2014 firing expression** | The full alert rule (incl. `>` and traffic/volume gates) | **Only while the alert would fire** | **Verify** \u2014 does the complete definition actually trigger on a real event? |\n\n> The threshold line is the `values.yaml` **default**. A cluster with a Helm override alerts at a different value than the line drawn.\n\n**Correlation panel**\n\nThe last panel in this row, **Feature-Server Active Sessions \u2014 per pod**, is not an alert pair -- it plots `vg_feature_server_call_session_count` per pod so you can check whether an alert above traces back to one specific pod (a drop to zero, or one pod carrying disproportionate load) versus a cluster-wide condition.",
