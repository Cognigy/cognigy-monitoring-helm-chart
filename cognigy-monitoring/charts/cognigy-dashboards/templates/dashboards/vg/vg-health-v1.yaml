{{- /*
Generated from json dashboard 'dashboards/vg/vg-health-v1.json'.
Do not change in-place! In order to change this file first modify the json dashboard 'dashboards/vg/vg-health-v1.json'
and then run the 'scripts/convert-dashboard/convert-dashboard.py' script.
*/ -}}
{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and 
    (index .Values "products" "vg" "enabled")
    (index .Values "products" "vg" "dashboards" "vg-health-v1" "enabled")
    (index .Values "products" "vg" "dashboards" "vg-health-v1" "yamlVersion")
    (not .Values.forceDeployJsonDashboards)
    (semverCompare ">=1.14.0-0" $kubeTargetVersion)
    (semverCompare "<9.9.9-9" $kubeTargetVersion)
     
}}
apiVersion: v1
kind: ConfigMap
metadata:
