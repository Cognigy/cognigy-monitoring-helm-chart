              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le, queue) (rate(rpc_latency_seconds_bucket{cluster=~\"$cluster\"}[$__rate_interval])))",
              "legendFormat": "p99 {{`{{`}}queue{{`}}`}}",
