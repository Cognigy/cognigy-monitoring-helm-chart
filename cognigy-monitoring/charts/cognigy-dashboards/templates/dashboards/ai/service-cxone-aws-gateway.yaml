              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (le, queue) (rate(rpc_latency_seconds_bucket{cluster=~\"$cluster\"}[$__rate_interval])))",
              "legendFormat": "p50 {{`{{`}}queue{{`}}`}}",
              "range": true,
              "refId": "A"
