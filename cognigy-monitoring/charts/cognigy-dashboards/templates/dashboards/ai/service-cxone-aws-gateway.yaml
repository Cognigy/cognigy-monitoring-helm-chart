          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum by (queue) (rate(rpc_failures_total{cluster=~\"$cluster\"}[$__rate_interval])) / clamp_min(sum by (queue) (rate(rpc_requests_total{cluster=~\"$cluster\"}[$__rate_interval])), 1)",
