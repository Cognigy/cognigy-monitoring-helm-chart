              "legendFormat": "failures {{`{{`}}queue{{`}}`}} ({{`{{`}}error_type{{`}}`}})",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "RPC Failure Rate",
          "type": "timeseries"
        },
