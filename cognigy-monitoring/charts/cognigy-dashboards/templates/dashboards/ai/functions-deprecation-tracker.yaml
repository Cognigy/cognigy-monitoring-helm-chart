            "content": "## Cognigy Functions \u2014 Deprecation Tracker\n\nCognigy Functions is being deprecated. This dashboard tracks which customers are still using it so we can contact them and safely disable the feature.\n\n**How to use:**\n- **Active Orgs** = customers still to migrate. Goal: reach 0.\n- **Cluster table** = once a cluster shows 0 executions, it is safe to disable Functions there.\n- **Org+cluster table** = the hit-list. Export weekly via panel menu \u2192 **Inspect \u2192 Data \u2192 Download CSV**.\n\n> \u26a0\ufe0f To resolve an `organisationId` to a customer name: open the **AI / Agents Overview** dashboard \u2192 **Organisations** panel \u2192 select the cluster \u2192 filter by ID.\n\n_Default time range: last 7 days. Data aggregated across all clusters via Thanos._",
            "mode": "markdown"
          },
          "pluginVersion": "12.0.2",
          "title": "About this dashboard",
          "type": "text"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Number of distinct organisations that have executed at least one Cognigy Function in the selected time range. Goal: reach 0.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.0.2",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "count(\n  sum by (organisationId) (\n    increase(cognigy_function_scheduler_scheduled_functions_count[$__range])\n  ) > 0\n)",
              "instant": true,
              "legendFormat": "__auto",
              "range": false,
              "refId": "A"
