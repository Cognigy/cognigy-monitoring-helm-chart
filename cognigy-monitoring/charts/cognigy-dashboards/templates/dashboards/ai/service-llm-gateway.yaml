{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and 
    (index .Values "products" "ai" "enabled")
    (index .Values "products" "ai" "dashboards" "service-llm-gateway" "enabled")
    (index .Values "products" "ai" "dashboards" "service-llm-gateway" "yamlVersion")
