          "id": 8,
          "panels": [],
          "title": "Traffic",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Request rate per REST route (the matched URL pattern, e.g. /v1/agents/:id \u2014 filtered by the Route variable above). Use this to see which endpoints the UI/Packaging actually exercise, and to spot a route's traffic disappearing (a caller stopped calling it, possibly a bug) or spiking (a new caller, a retry loop, or a UI bug making excess calls).",
          "fieldConfig": {
