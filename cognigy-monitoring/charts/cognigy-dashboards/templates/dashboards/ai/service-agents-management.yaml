{{- /*
Generated from json dashboard 'dashboards/ai/service-agents-management.json'.
Do not change in-place! In order to change this file first modify the json dashboard 'dashboards/ai/service-agents-management.json'
and then run the 'scripts/convert-dashboard/convert-dashboard.py' script.
*/ -}}
{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and 
    (index .Values "products" "ai" "enabled")
    (index .Values "products" "ai" "dashboards" "service-agents-management" "enabled")
    (index .Values "products" "ai" "dashboards" "service-agents-management" "yamlVersion")
    (not .Values.forceDeployJsonDashboards)
    (semverCompare ">=1.14.0-0" $kubeTargetVersion)
    (semverCompare "<9.9.9-9" $kubeTargetVersion)
     
}}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ template "cognigy-dashboards.namespace" . }}
  name: {{ printf "%s-%s" (include "cognigy-dashboards.fullname" $) "service-agents-management" | trunc 63 | trimSuffix "-" }}
  {{- with $.Values.grafana.sidecar.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- if $.Values.grafana.sidecar.dashboards.label }}
    {{ $.Values.grafana.sidecar.dashboards.label }}: {{ ternary $.Values.grafana.sidecar.dashboards.labelValue "1" (not (empty $.Values.grafana.sidecar.dashboards.labelValue)) | quote }}
    {{- end }}
    app: {{ template "cognigy-dashboards.name" $ }}-grafana
    {{- include "cognigy-dashboards.labels" $ | nindent 4 }}
data:
  service-agents-management.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Headline",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "REST API requests per second across the whole management API (agents, personas, tools, skills, MCP servers, workflows \u2014 everything except the ExecuteTurn/import-export gRPC surface, which has its own row below). This is the top-line traffic indicator for the CRUD API the UI and Packaging use.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum(rate(cognigy_agents_http_requests_total{cluster=\"$cluster\", namespace=\"$namespace\"}[$__rate_interval]))",
              "instant": false,
              "legendFormat": "req/s",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request rate",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "The share of REST requests that returned a 5xx (server error) status, out of all requests. This is a genuine backend failure \u2014 unlike a 4xx, the caller did nothing wrong. Healthy is close to 0%; use 'Errors \u2192 5xx by route' below to find which specific endpoint is failing.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum(rate(cognigy_agents_http_requests_total{cluster=\"$cluster\", namespace=\"$namespace\", status_class=\"5xx\"}[$__rate_interval])) / clamp_min(sum(rate(cognigy_agents_http_requests_total{cluster=\"$cluster\", namespace=\"$namespace\"}[$__rate_interval])), 0.001)",
              "instant": false,
              "legendFormat": "5xx %",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "5xx %",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "The share of REST requests that returned a 4xx (client error) status. This includes ordinary, expected validation failures as well as 401/403 from the auth-gateway integration, so a nonzero baseline is normal \u2014 watch for a sudden jump rather than treating any nonzero value as a problem, and use 'Errors \u2192 4xx by route' to see if it's concentrated on one endpoint (a client bug or an auth/permissions change) or spread evenly (more likely just normal usage).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.05
                  },
                  {
                    "color": "red",
                    "value": 0.2
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "sum(rate(cognigy_agents_http_requests_total{cluster=\"$cluster\", namespace=\"$namespace\", status_class=\"4xx\"}[$__rate_interval])) / clamp_min(sum(rate(cognigy_agents_http_requests_total{cluster=\"$cluster\", namespace=\"$namespace\"}[$__rate_interval])), 0.001)",
              "instant": false,
              "legendFormat": "4xx %",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "4xx %",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "The slowest 1% of REST requests, in seconds, across every route. This is the number a UI user actually feels as 'the page is slow' \u2014 use 'Latency \u2192 p95 by route' to find which specific endpoint is dragging it up.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 5
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(cognigy_agents_http_request_duration_seconds_bucket{cluster=\"$cluster\", namespace=\"$namespace\"}[$__rate_interval])))",
              "instant": false,
              "legendFormat": "p99",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "p99 latency",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "How many REST requests are currently being handled, right now, across all pods. A sustained climb without a matching rise in 'Request rate' can mean requests are piling up rather than completing quickly \u2014 check p99 latency and the Go runtime row for a service that's falling behind.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 5
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
