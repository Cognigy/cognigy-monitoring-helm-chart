{{- /*
Generated from json dashboard 'dashboards/ci/github-actions.json'.
Do not change in-place! In order to change this file first modify the json dashboard 'dashboards/ci/github-actions.json'
and then run the 'scripts/convert-dashboard/convert-dashboard.py' script.
*/ -}}
{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and 
    (index .Values "products" "ci" "enabled")
    (index .Values "products" "ci" "dashboards" "github-actions" "enabled")
    (index .Values "products" "ci" "dashboards" "github-actions" "yamlVersion")
    (not .Values.forceDeployJsonDashboards)
    (semverCompare ">=1.14.0-0" $kubeTargetVersion)
    (semverCompare "<9.9.9-9" $kubeTargetVersion)
     
}}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ template "cognigy-dashboards.namespace" . }}
  name: {{ printf "%s-%s" (include "cognigy-dashboards.fullname" $) "github-actions" | trunc 63 | trimSuffix "-" }}
  {{- with $.Values.grafana.sidecar.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- if $.Values.grafana.sidecar.dashboards.label }}
    {{ $.Values.grafana.sidecar.dashboards.label }}: {{ ternary $.Values.grafana.sidecar.dashboards.labelValue "1" (not (empty $.Values.grafana.sidecar.dashboards.labelValue)) | quote }}
    {{- end }}
    app: {{ template "cognigy-dashboards.name" $ }}-grafana
    {{- include "cognigy-dashboards.labels" $ | nindent 4 }}
data:
  github-actions.json: |-
    {
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "count(count by (run) (max_over_time(github_workflow_run_status{repo=~\"$repo\", name=~\"$workflow\"}[$__range])))",
              "refId": "A"
            }
          ],
          "title": "Total runs (selected range)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "count(count by (run) (max_over_time(github_workflow_run_status{status=\"success\", repo=~\"$repo\", name=~\"$workflow\"}[$__range])))",
              "refId": "A"
            }
          ],
          "title": "Successful runs",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "count(count by (run) (max_over_time(github_workflow_run_status{status=\"failure\", repo=~\"$repo\", name=~\"$workflow\"}[$__range]))) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "Failed runs",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 25
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "100 * (count(count by (run) (max_over_time(github_workflow_run_status{status=\"failure\", repo=~\"$repo\", name=~\"$workflow\"}[$__range]))) or vector(0)) / count(count by (run) (max_over_time(github_workflow_run_status{repo=~\"$repo\", name=~\"$workflow\"}[$__range])))",
              "refId": "A"
            }
          ],
          "title": "Failure rate",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Number of runs currently tracked by the exporter, grouped by conclusion/status. Reflects activity over the retention window.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "count by (status) (github_workflow_run_status{repo=~\"$repo\", name=~\"$workflow\"})",
              "legendFormat": "{{`{{`}}status{{`}}`}}",
              "refId": "A"
            }
          ],
          "title": "Tracked runs by conclusion",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "id": 6,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Failed runs"
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "topk(20, count by (repo, name) (max_over_time(github_workflow_run_status{status=\"failure\", repo=~\"$repo\"}[$__range])))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Workflows that fail the most",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "Failed runs",
                  "name": "Workflow",
                  "repo": "Repository"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "id": 7,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Max duration"
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "topk(20, max by (repo, name) (max_over_time(github_workflow_run_duration_ms{repo=~\"$repo\", name=~\"$workflow\"}[$__range])))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Longest runs (max duration)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "Max duration",
                  "name": "Workflow",
                  "repo": "Repository"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "avg by (name) (github_workflow_run_duration_ms{repo=~\"$repo\", name=~\"$workflow\"})",
              "legendFormat": "{{`{{`}}name{{`}}`}}",
              "refId": "A"
            }
          ],
          "title": "Average run duration by workflow",
          "type": "timeseries"
        }
      ],
      "refresh": "{{ index .Values "products" "ci" "dashboards" "github-actions" "refreshInterval" | default "5m" }}",
      "schemaVersion": 39,
      "tags": [
        "cognigy",
        "ci",
        "github-actions"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0,
            "includeAll": false,
            "label": "Data Source",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "queryValue": "",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "allValue": null,
            "current": {
              "text": "",
              "value": ""
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "definition": "label_values(up{job=\"kube-state-metrics\"}, cluster)",
            "hide": {{ if .Values.grafana.sidecar.dashboards.multicluster.global.enabled }}0{{ else }}2{{ end }},
            "includeAll": false,
            "label": "Cluster",
            "multi": false,
            "name": "cluster",
            "options": [],
            "query": {
              "query": "label_values(up{job=\"kube-state-metrics\"}, cluster)",
              "refId": "Metrics-cluster-Variable-Query"
            },
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "tagValuesQuery": "",
            "tags": [],
            "tagsQuery": "",
            "type": "query",
            "useTags": false
          },
          {
            "allValue": ".*",
            "current": {
              "text": "",
              "value": ""
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "includeAll": true,
            "label": "Repository",
            "multi": true,
            "name": "repo",
            "query": {
              "query": "label_values(github_workflow_run_status, repo)",
              "refId": "repo"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {
              "text": "",
              "value": ""
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "includeAll": true,
            "label": "Workflow",
            "multi": true,
            "name": "workflow",
            "query": {
              "query": "label_values(github_workflow_run_status{repo=~\"$repo\"}, name)",
              "refId": "workflow"
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "{{ index .Values "products" "ci" "dashboards" "github-actions" "timeFrom" | default "now-3h" }}",
        "to": "now"
      },
      "timezone": "{{ .Values.grafana.defaultDashboardsTimezone }}",
      "title": "CI / GitHub Actions",
      "uid": "cognigy-github-actions",
      "version": 1
    }
{{- end }}