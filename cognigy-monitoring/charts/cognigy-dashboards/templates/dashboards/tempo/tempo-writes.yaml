{{- /*
Generated from json dashboard 'dashboards/tempo/tempo-writes.json'.
Do not change in-place! In order to change this file first modify the json dashboard 'dashboards/tempo/tempo-writes.json'
and then run the 'scripts/convert-dashboard/convert-dashboard.py' script.
*/ -}}
{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and 
    (index .Values "products" "tempo" "enabled")
    (index .Values "products" "tempo" "dashboards" "tempo-writes" "enabled")
    (index .Values "products" "tempo" "dashboards" "tempo-writes" "yamlVersion")
    (not .Values.forceDeployJsonDashboards)
    (semverCompare ">=1.14.0-0" $kubeTargetVersion)
    (semverCompare "<9.9.9-9" $kubeTargetVersion)
     
}}
apiVersion: v1
