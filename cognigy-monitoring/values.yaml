## Default values for cognigy-monitoring stack
## This is a YAML-formatted file.

### kube-promeheus-stack configuration
kubepromstack:
  enabled: true
  # Create default rules for monitoring
  defaultRules:
    create: true
    rules:
      alertmanager: true
      etcd: false
      general: true
      k8s: true
      kubeApiserver: true
      kubeApiserverAvailability: false
      kubeApiserverHistogram: false # workaround due to duplicate
      kubeApiserverBurnrate: false # workaround due to duplicate
      kubeApiserverSlos: false
      kubelet: true
      kubePrometheusGeneral: true
      kubePrometheusNodeRecording: true
      kubernetesApps: false # use cognigy-alerts/kubernetes.rules.yaml instead
      kubernetesResources: true
      kubernetesStorage: true
      kubernetesSystem: false
      kubeScheduler: true
      kubeStateMetrics: true
      network: true
      node: true
      prometheus: true
      prometheusOperator: true
  # Disable kubeProxy monitoring,
  # otherwise change metricsBindAddress: 0.0.0.0:10249 in kube-proxy-config ConfigMap
  kubeProxy:
    enabled: false
  # Not supported on EKS
  kubeControllerManager:
    enabled: false
  # Not supported on EKS
  kubeScheduler:
    enabled: false

  # Global image registry and pull secrets
  global:
    imageRegistry: "cognigy.azurecr.io"
    imagePullSecrets:
      - name: "cognigy-registry-token"

  ### AlertManager Configuration
  alertmanager:
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - 'severity = critical'
          target_matchers:
            - 'severity =~ warning|info'
          equal: ['cluster', 'alertname']
        - source_matchers:
            - 'severity = warning'
          target_matchers:
            - 'severity = info'
          equal: ['cluster', 'alertname']
        - source_matchers:
            - 'alertname = InfoInhibitor'
          target_matchers:
            - 'severity = info'
          equal:
            - 'namespace'

      route:
        receiver: 'pagerduty'
        group_by: ['cluster', 'alertname', 'namespace']
        group_wait: 30s
        group_interval: 15m
        repeat_interval: 12h
        routes:
          - receiver: 'null'
            matchers:
              - alertname =~ "InfoInhibitor|Watchdog"
          ## Uncomment to enable additional MS Teams channels
          #- receiver: 'msteams-runtime'
          #  matchers:
          #    - group = runtime-custom-alert-rules
          #- receiver: 'msteams-vg'
          #  matchers:
          #    - group = vg-custom-alert-rules
      receivers:
        - name: 'pagerduty'
        - name: 'null'
        ## Uncomment to enable additional MS Teams channels
        #- name: 'msteams-runtime'
        #  webhook_configs:
        #    - send_resolved: true
        #      url: 'http://prometheus-msteams:2000/runtime'
        #- name: 'msteams-vg'
        #  webhook_configs:
        #    - send_resolved: true
        #      url: 'http://prometheus-msteams:2000/vg'

  # prometheusOperator:
  #   ## Create Endpoints objects for kubelet targets.
  #   kubeletEndpointsEnabled: false
  #   ## Create EndpointSlice objects for kubelet targets.
  #   kubeletEndpointSliceEnabled: true

  ### Prometheus configuration
  prometheus:
    prometheusSpec:
      ## Disable label-based selectors, otherwise release: {{ .Release.Name }} is used
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      ## Specify Retention and max retention size
      retention: "7d"
      retentionSize: "10GB"

      ## External labels to add to any time series or alerts when communicating with external systems
      ## in case you want to set a specific cluster name
      externalLabels: {}

      ## Prometheus StorageSpec for persistent data
      ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/user-guides/storage.md
      ##
      ## Using PersistentVolumeClaim
      ##
      #  volumeClaimTemplate:
      #    spec:
      #      storageClassName: gluster
      #      accessModes: ["ReadWriteOnce"]
      #      resources:
      #        requests:
      #          storage: 50Gi
      #    selector: {}
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: "15Gi"

      ## Prometheus Pod resources
      resources:
        requests:
          memory: 6000Mi
          cpu: "0.8"
        limits:
          memory: 6000Mi
          cpu: "2"

  ### Grafana configuration
  grafana:
    ## Timezone for the default dashboards
    ## Other options are: browser or a specific timezone, i.e. Europe/Luxembourg
    ##
    defaultDashboardsTimezone: browser
    ## Disable deprecated PodSecurityPolicy
    rbac:
      pspEnabled: false
    ## Since Kibana is a stateful deployment, Recreate must be used,
    # otherwise Pod will not be able to reconnect the PVC
    deploymentStrategy:
      type: Recreate

    ## Administrator credentials when not using an existing secret (see below)
    # if adminPassword is not set it will be automatically generated
    adminUser: admin
    ## adminPassword: strongpassword

    ## Ingress settings
    # currently with defaults for traefik
    ingress:
      # If true, Grafana Ingress will be created
      enabled: false

      # To support kubernetes version >1.21
      ingressClassName: traefik

      # Annotations for Grafana Ingress
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        # kubernetes.io/ingress.class: nginx
        # kubernetes.io/tls-acme: "true"

      # Labels to be added to the Ingress
      labels: {}

      ## Hostnames.
      ## Must be provided if Ingress is enable.
      ##
      # hosts:
      #   - grafana.domain.com
      hosts:

      ## Path for grafana ingress
      path: /

      ## TLS configuration for grafana Ingress
      ## Secret must be manually created in the namespace
      ##
      tls:
      - secretName: cognigy-traefik
      #   hosts:
      #   - grafana.example.com

    ## For VoiceGateway uncomment `deleteDatasources` and `additionalDataSources` sections to enable InfluxDB and
    # InfluxDB-Telegraf data sources
    deleteDatasources: []
    #  - name: InfluxDB
    #    orgId: 1
    #  - name: InfluxDB-Telegraf
    #    orgId: 1

    additionalDataSources: []
    #  - name: InfluxDB
    #    type: influxdb
    #    access: proxy
    #    database: homer
    #    user: grafana
    #    url: http://influxdb:8086
    #    jsonData:
    #      timeInterval: "15s"
    #    # <bool> allow users to edit datasources from the UI.
    #    editable: true
    #  - name: InfluxDB-Telegraf
    #    type: influxdb
    #    access: proxy
    #    database: telegraf
    #    user: grafana
    #    url: http://influxdb:8086
    #    jsonData:
    #      timeInterval: "15s"
    #    # <bool> allow users to edit datasources from the UI.
    #    editable: true

    ## initChownData container image
    initChownData:
      image:
        ## Repository name in cognigy.azurecr.io ACR
        repository: busybox

## Cognigy Product Dashboards, enable/disable dashboards according to your installation
cognigy-dashboards:
  enabled: true
  products:
    # Dashboards for Cognigy backend services
    services:
      enabled: true
      dashboards:
        traefik:
          enabled: true
        mongodb:
          enabled: true
        rabbitmq:
          enabled: true
        redis:
          enabled: true
        pod-services:
          enabled: true
        mysql:
          enabled: false
    # Cognigy.AI product dashboards
    ai:
      enabled: true
    # Cognigy Live Agent product dashboards
    la:
      enabled: false
    # Cognigy VoiceGateway product dashboards
    vg:
      enabled: false

## Prometheus Alerts for Cognigy products
# enable/disable rules for separate products and alerts
# check cognigy-alerts chart for details
cognigy-alerts:
  enabled: true
  rules:
    ai:
      enabled: true
    # Cognigy.AI runtime alerts, enable only if absolutely necessary
    runtime:
      enabled: false
    vg:
      enabled: false

## Prometheus Monitors for backend services
cognigy-monitors:
  enabled: true
  monitors:
    rabbitmq:
      enabled: true
      namespace: "cognigy-ai"
    traefik:
      enabled: true
      namespace: "cognigy-ai"

## Some legacy clusters do not come with CPU Metrics out of the box, enable cadvisor for such clusters
cadvisor:
  enabled: false
  image:
    repository: cognigy.azurecr.io/cadvisor/cadvisor
  pullSecrets:
    - cognigy-registry-token

## MS Teams-based alerting for Cognigy.AI runtime alerts
# enable only if runtime alerts are enabled
prometheus-msteams:
  enabled: false
  image:
    repository: cognigy.azurecr.io/prometheusmsteams/prometheus-msteams
  imagePullSecrets:
    - name: "cognigy-registry-token"
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 25m
      memory: 32Mi
  connectors:
    - runtime: MSTEAMS_RUNTIME_WEBHOOK_URL # specify MS Teams Webhook URL for Runtime alerts
    - vg: MSTEAMS_VG_WEBHOOK_URL # specify MS Teams Webhook URL for VG alerts

## Promitor: scrape Azure Monitor metrics into Prometheus.
## Bundles two upstream charts as optional dependencies:
##   - promitor-agent-resource-discovery (alias: promitorDiscovery)
##   - promitor-agent-scraper            (alias: promitorScraper)
##
## Both are disabled by default. When enabled, Prometheus picks up the
## scraper via its built-in ServiceMonitor (enabled below).
##
## NOTE: vendored Promitor subcharts carry a custom patch on container name 
##       so the camelCase aliases below satisfy RFC 1123.

## Resource-discovery agent. Disabled by default.
promitorDiscovery:
  enabled: false

  fullnameOverride: promitor-discovery
  nameOverride: promitor-discovery

  image:
    repository: cognigy.azurecr.io/promitor/promitor-agent-resource-discovery
    tag: "0.15.0"
    pullSecrets:
      - name: cognigy-registry-token

  ## SP auth. identity.id = the Service Principal's appId (REQUIRED when enabled).
  azureAuthentication:
    mode: ServicePrincipal
    identity:
      id: ""
      key: ""

  secrets:
    createSecret: false  # required so the Deployment mounts PROMITOR_AUTH_APPKEY from `secretName` below (operator-created) instead of the chart creating its own Secret.
    secretName: promitor-azure-credentials

  azureLandscape:
    tenantId: ""
    subscriptions: []
    ## Example:
    ## subscriptions:
    ##   - "00000000-0000-0000-0000-000000000000"

  ## Groups of Azure resources to enumerate. The scraper references these
  ## groups by name under each metric's `resourceDiscoveryGroups`.
  resourceDiscoveryGroups:
    - name: all-loadbalancers
      type: LoadBalancer

## Scraper agent. Disabled by default.
promitorScraper:
  enabled: false

  fullnameOverride: promitor-scraper
  nameOverride: promitor-scraper
  
  image:
    repository: cognigy.azurecr.io/promitor/promitor-agent-scraper
    tag: "2.15.0"
    pullSecrets:
      - name: cognigy-registry-token

  azureAuthentication:
    mode: ServicePrincipal
    identity:
      id: ""
      key: ""

  secrets:
    createSecret: false  # required so the Deployment mounts PROMITOR_AUTH_APPKEY from `secretName` below (operator-created) instead of the chart creating its own Secret.
    secretName: promitor-azure-credentials

  azureMetadata:
    tenantId: ""
    subscriptionId: ""
    resourceGroupName: promitor
    cloud: "Global"

  metricDefaults:
    aggregation:
      interval: 00:01:00
    scraping:
      schedule: "* * * * *"

  metricSinks:
    prometheusScrapingEndpoint:
      enabled: true
      baseUriPath: /metrics
      enableMetricTimestamps: true
      serviceMonitor:
        enabled: true
        interval: 60s
        timeout: 10s

  resourceDiscovery:
    enabled: true
    host: promitor-discovery
    port: 8889

  ## Metrics to scrape. Defaults cover the Azure Load Balancer SLI set
  ## (VIP/DIP availability, byte/packet counters, SNAT health). Override or
  ## extend as needed.
  metrics:
    - name: azure_lb_vip_availability
      description: "Azure Load Balancer VIP availability"
      resourceType: LoadBalancer
      azureMetricConfiguration:
        metricName: VipAvailability
        aggregation:
          type: Average
      resourceDiscoveryGroups:
        - name: all-loadbalancers

    - name: azure_lb_dip_availability
      description: "Azure Load Balancer DIP availability"
      resourceType: LoadBalancer
      azureMetricConfiguration:
        metricName: DipAvailability
        aggregation:
          type: Average
      resourceDiscoveryGroups:
        - name: all-loadbalancers

    - name: azure_lb_byte_count
      description: "Azure Load Balancer byte count"
      resourceType: LoadBalancer
      azureMetricConfiguration:
        metricName: ByteCount
        aggregation:
          type: Total
      resourceDiscoveryGroups:
        - name: all-loadbalancers

    - name: azure_lb_packet_count
      description: "Azure Load Balancer packet count"
      resourceType: LoadBalancer
      azureMetricConfiguration:
        metricName: PacketCount
        aggregation:
          type: Total
      resourceDiscoveryGroups:
        - name: all-loadbalancers

    - name: azure_lb_syn_count
      description: "Azure Load Balancer SYN count"
      resourceType: LoadBalancer
      azureMetricConfiguration:
        metricName: SYNCount
        aggregation:
          type: Total
      resourceDiscoveryGroups:
        - name: all-loadbalancers

    - name: azure_lb_snat_connection_count
      description: "Azure Load Balancer SNAT connections (split by Backend IP and Connection State per SNAT Exhaustion runbook)"
      resourceType: LoadBalancer
      azureMetricConfiguration:
        metricName: SnatConnectionCount
        aggregation:
          type: Total
        dimensions:
          - name: BackendIPAddress
          - name: ConnectionState
      resourceDiscoveryGroups:
        - name: all-loadbalancers

    - name: azure_lb_allocated_snat_ports
      description: "Azure Load Balancer allocated SNAT ports (split by Backend IP and Protocol; filter Protocol=TCP for per-node value, see SNAT Exhaustion runbook)"
      resourceType: LoadBalancer
      azureMetricConfiguration:
        metricName: AllocatedSnatPorts
        aggregation:
          type: Average
        dimensions:
          - name: BackendIPAddress
          - name: ProtocolType
      resourceDiscoveryGroups:
        - name: all-loadbalancers

    - name: azure_lb_used_snat_ports
      description: "Azure Load Balancer used SNAT ports (split by Backend IP and Protocol; the key signal of SNAT exhaustion per node)"
      resourceType: LoadBalancer
      azureMetricConfiguration:
        metricName: UsedSnatPorts
        aggregation:
          type: Average
        dimensions:
          - name: BackendIPAddress
          - name: ProtocolType
      resourceDiscoveryGroups:
        - name: all-loadbalancers

## Grafana Alloy: OTLP edge collector for the regional Tempo tracing
## rollout (see the Distributed Tracing architecture page in Confluence).
## Bundles two charts as optional dependencies, both disabled by default:
##   - alloy          (vendored upstream grafana/alloy — owns the workload:
##                      Deployment, HPA, Services, RBAC, ServiceMonitor)
##   - cognigy-alloy   (in-house — owns only the River ConfigMap, rendered
##                      from the structured values below)
##
## NOTE: alloy.fullnameOverride and cognigy-alloy.alloyFullname must stay
##       equal (the config's trace-ID load-balancing resolver targets
##       "<alloyFullname>-cluster"), and alloy.alloy.configMap.name must
##       equal cognigy-alloy.configMapName. Changing one without the other
##       breaks the collector silently — Helm renders fine, the pod just
##       can't find its config or its peers.
##
## Required per cluster when enabling: cognigy-alloy.clusterName and
## cognigy-alloy.tempo.endpoint. See the root README for the full
## enablement snippet and prerequisites (the image mirror to ACR).

alloy:
  enabled: false
  fullnameOverride: cognigy-alloy

  crds:
    create: false # the PodLogs CRD is cluster-scoped and unused here

  image:
    # The ACR mirror is a flat repository name, not upstream's "grafana/alloy"
    # path — the mirrored image is cognigy.azurecr.io/grafana-alloy:v1.19.2.
    repository: grafana-alloy

  global:
    image:
      registry: cognigy.azurecr.io
      pullSecrets:
        - name: cognigy-registry-token

  configReloader:
    image:
      # registry is intentionally not set here: templates/containers/_watch.yaml
      # always prefers global.image.registry over this field when the former
      # is set, so global.image.registry above (cognigy.azurecr.io) applies
      # to this image too. Tag is aligned with vendored kube-prometheus-stack
      # (75.6.0) so no extra image needs mirroring to ACR — upstream's own
      # default tag is digest-pinned, which an ACR mirror would invalidate.
      repository: prometheus-operator/prometheus-config-reloader
      tag: v0.83.0
      digest: ""

  controller:
    type: deployment
    replicas: 1 # fallback used only when autoscaling below is disabled

    autoscaling:
      horizontal:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 80
        # Load-bearing: chart defaults this to 80, giving a memory-only
        # HPA unless explicitly zeroed here.
        targetMemoryUtilizationPercentage: 0
        # Biased slow: a scale event reshuffles the trace-ID hash ring,
        # splitting in-flight traces across old/new ring members.
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
        scaleDown:
          # Scale-down also discards the departing pod's queue (see
          # volumes.extra below) — bias hard against it.
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300

    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alloy

    volumes:
      extra:
        # Not persistent: lost on restart/reschedule/eviction/scale-down,
        # unlike the PVC this replaced (avoids PVC leaks on scale-down).
        # sizeLimit overflow evicts the pod rather than just failing
        # writes. 10Gi has large headroom — loadtest's PVC-backed queue
        # peaked at ~60MiB under real traffic.
        - name: alloy-data
          emptyDir:
            sizeLimit: 10Gi

  alloy:
    # otelcol.storage.file (the disk-backed sending_queue, pod-local, not
    # durable — see volumes.extra above) is public-preview in v1.19.2.
    # Required for the on-disk queue this chart exists for.
    stabilityLevel: "public-preview"
    storagePath: /var/lib/alloy
    # Don't phone home anonymous usage stats to Grafana Labs.
    enableReporting: false
    clustering:
      enabled: true # creates the "-cluster" headless Service the
                    # trace-ID load-balancing resolver targets
    configMap:
      create: false
      name: cognigy-alloy-config
    mounts:
      extra:
        - name: alloy-data
          mountPath: /var/lib/alloy
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
        appProtocol: h2c
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
      - name: otlp-internal
        port: 4319
        targetPort: 4319
        protocol: TCP
        appProtocol: h2c
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

  rbac:
    create: true
    # Narrowed from the upstream chart default, which also grants
    # secrets/configmaps/events/prometheusrules/pods-log cluster-wide for
    # discovery.*, loki.* and mimir.* components this collector never runs.
    #
    # Split across rules/clusterRules only to keep both lists non-empty:
    # templates/rbac.yaml concatenates them with `toYaml` unconditionally
    # whenever either is set, so rules non-empty + clusterRules: [] (or
    # vice versa) renders a bare "[]" inside a YAML block sequence and
    # fails to parse. Both resources are namespace-scoped; the split has
    # no RBAC effect since rbac.namespaces is unset here (one ClusterRole
    # either way) — it exists purely to work around that upstream bug.
    rules:
      - apiGroups: ["", "discovery.k8s.io"]
        resources: ["endpoints", "endpointslices", "pods", "namespaces"]
        verbs: ["get", "list", "watch"]
    clusterRules:
      - apiGroups: ["apps"]
        resources: ["replicasets"]
        verbs: ["get", "list", "watch"]

  serviceMonitor:
    enabled: true

  networkPolicy:
    enabled: true
    # Ingress only — egress is intentionally left unmanaged (the collector
    # needs the k8s API, DNS and the regional Tempo endpoint, and locking
    # that down is a separate, bigger change than this one).
    policyTypes: ["Ingress"]
    ingress:
      # OTLP ingest (product services → collector): reachable from any
      # pod, any namespace — this is the whole point of the collector.
      - ports:
          - port: 4317
            protocol: TCP
          - port: 4318
            protocol: TCP
          - port: 12345 # http-metrics/UI/readiness + clustering gossip
            protocol: TCP
      # Internal trace-ID load-balancing hop: peer Alloy pods only (same
      # namespace, "app.kubernetes.io/name: alloy" is this Deployment's
      # own pods — see alloy.name in charts/alloy/templates/_helpers.tpl).
      # Never reachable from product services, which must go through the
      # ingest ports above so every span of a trace lands on one replica.
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: alloy
        ports:
          - port: 4319
            protocol: TCP

cognigy-alloy:
  enabled: false
  configMapName: cognigy-alloy-config
  alloyFullname: cognigy-alloy

  clusterName: "" # REQUIRED, e.g. "foo-corp-dev"
  tempo:
    endpoint: "" # REQUIRED, e.g. "tempo-prod-eu.internal:4317"
