apiVersion: v2
name: cognigy-monitoring
description: Cognigy Monitoring Umbrella Chart
type: application
version: 2026.3.0
appVersion: 2026.3.0
kubeVersion: "<v1.36.0-0"

dependencies:
  - name: kube-prometheus-stack
    version: 75.6.0
    condition: kube-prometheus-stack.enabled
    alias: kubepromstack
  - name: cognigy-monitors
    condition: cognigy-monitors.enabled
    version: 0.1.0
  - name: cognigy-dashboards
    condition: cognigy-dashboards.enabled
    version: 0.7.0
  - name: cognigy-alerts
    condition: cognigy-alerts.enabled
    version: 0.2.0
  - name: prometheus-msteams
    condition: prometheus-msteams.enabled
    version: 1.3.3
  - name: cadvisor
    condition: cadvisor.enabled
    version: 2.3.3
  - name: promitor-agent-resource-discovery
    condition: promitorDiscovery.enabled
    version: 0.15.0
    alias: promitorDiscovery
  - name: promitor-agent-scraper
    condition: promitorScraper.enabled
    version: 2.15.0
    alias: promitorScraper
